<meta charset="utf-8">
<title>TAS Decision Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f4f6f4; --surface:#ffffff; --surface-2:#eef1ee;
    --ink:#17242a; --muted:#54635f; --faint:#7d8a86;
    --accent:#2c6b64; --accent-2:#2f7d5b; --accent-soft:#dfeae7; --accent-ink:#1e4e49;
    --border:#dbe2dd; --border-strong:#c6d0cb;
    --hi:#b23a2e; --hi-bg:#f6e2de;
    --med:#a5721a; --med-bg:#f4ecd6;
    --str:#2f7d5b; --str-bg:#dbeee3;
    --on-accent:#ffffff;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(23,36,42,.05),0 8px 24px rgba(23,36,42,.07);
    --shadow-lift:0 2px 6px rgba(23,36,42,.08),0 14px 34px rgba(23,36,42,.12);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#10171a; --surface:#182124; --surface-2:#1e2a2d;
      --ink:#e7ece9; --muted:#a0aeaa; --faint:#7e8d89;
      --accent:#63b6ab; --accent-2:#71c99c; --accent-soft:#1b3a37; --accent-ink:#a6ded6;
      --border:#2a3639; --border-strong:#3a494c;
      --hi:#e58274; --hi-bg:#37211e;
      --med:#dca544; --med-bg:#352a16;
      --str:#71c99c; --str-bg:#1a3228;
      --on-accent:#08201d;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
      --shadow-lift:0 2px 8px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10171a; --surface:#182124; --surface-2:#1e2a2d;
    --ink:#e7ece9; --muted:#a0aeaa; --faint:#7e8d89;
    --accent:#63b6ab; --accent-2:#71c99c; --accent-soft:#1b3a37; --accent-ink:#a6ded6;
    --border:#2a3639; --border-strong:#3a494c;
    --hi:#e58274; --hi-bg:#37211e;
    --med:#dca544; --med-bg:#352a16;
    --str:#71c99c; --str-bg:#1a3228;
    --on-accent:#08201d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.4);
    --shadow-lift:0 2px 8px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{max-width:760px;margin:0 auto;padding:clamp(18px,4vw,44px) clamp(16px,4vw,32px) 72px}
  button{font-family:inherit}
  a{color:var(--accent-ink);text-underline-offset:2px}

  /* header */
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .mark{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);box-shadow:var(--shadow)}
  .brand .mark svg{width:20px;height:20px}
  .brand .kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(25px,4.6vw,36px);line-height:1.1;letter-spacing:-.01em;margin:2px 0 6px;text-wrap:balance}
  .sub{color:var(--muted);margin:0 0 22px;max-width:60ch}

  /* stepper */
  .stepper{display:flex;align-items:center;gap:6px;margin:0 0 26px;flex-wrap:wrap}
  .stepper .st{display:flex;align-items:center;gap:7px}
  .stepper .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--border-strong);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--faint);background:var(--surface);font-variant-numeric:tabular-nums;transition:.25s}
  .stepper .lab{font-size:12.5px;color:var(--faint);transition:.25s}
  .stepper .st.done .dot{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
  .stepper .st.active .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .stepper .st.active .lab{color:var(--ink);font-weight:600}
  .stepper .st.done .lab{color:var(--muted)}
  .stepper .bar{width:16px;height:2px;background:var(--border-strong);border-radius:2px}
  @media (max-width:620px){.stepper .lab{display:none}.stepper .bar{width:10px}}

  /* card / question */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:clamp(20px,4vw,30px);box-shadow:var(--shadow)}
  .qeyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  .qtitle{font-family:var(--serif);font-weight:600;font-size:clamp(21px,3.4vw,27px);line-height:1.18;letter-spacing:-.005em;margin:0 0 10px;text-wrap:balance}
  .qhelp{color:var(--muted);font-size:15px;margin:0 0 22px;max-width:62ch}

  .opts{display:grid;gap:12px}
  .opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1.5px solid var(--border-strong);border-radius:13px;padding:15px 16px;color:var(--ink);transition:transform .12s ease,border-color .15s,box-shadow .15s,background .15s}
  .opt:hover{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
  .opt:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-color:var(--accent)}
  .opt .tick{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--accent);margin-top:1px;transition:.15s}
  .opt:hover .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .opt>span:not(.tick):not(.arrow){flex:1;min-width:0}
  .opt .ot{display:block;font-weight:650;font-size:16.5px}
  .opt .od{display:block;color:var(--muted);font-size:14px;margin-top:2px}
  .opt .arrow{margin-left:auto;align-self:center;color:var(--faint);transition:.15s;flex:none}
  .opt:hover .arrow{color:var(--accent);transform:translateX(3px)}

  .riskbox{background:var(--med-bg);border:1px solid var(--med);border-radius:12px;padding:14px 16px;margin:0 0 22px}
  .riskbox .rh{font-weight:700;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--med);margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .riskbox p{margin:0;font-size:14.5px;color:var(--ink)}

  .nav{display:flex;gap:10px;align-items:center;margin-top:22px}
  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 15px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .btn.ghost{border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--accent-ink)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn.solid:hover{filter:brightness(1.05)}
  .spacer{flex:1}

  /* intro */
  .lede{font-size:17px;color:var(--muted);max-width:60ch;margin:0 0 18px}
  .factrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0 26px}
  .fact{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px}
  .fact .fh{font-weight:700;font-size:14px;margin-bottom:3px}
  .fact .fd{font-size:13px;color:var(--muted)}
  .disc{font-size:13px;color:var(--faint);border-left:3px solid var(--border-strong);padding-left:12px;margin:18px 0 0}

  /* results */
  .rhead{margin-bottom:8px}
  .verdict-pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:5px 12px;margin-bottom:14px}
  .rtitle{font-family:var(--serif);font-weight:600;font-size:clamp(23px,4vw,32px);line-height:1.12;margin:0 0 8px;text-wrap:balance}
  .rsub{color:var(--muted);margin:0 0 18px;max-width:64ch}
  .recap{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}
  .recap .rc{font-size:12.5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 11px;color:var(--muted)}
  .recap .rc b{color:var(--ink);font-weight:600}

  .rec{border-radius:14px;padding:18px 18px;margin:0 0 14px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow)}
  .rec.key{border-left:4px solid var(--accent)}
  .rec.warn{border-left:4px solid var(--med);background:var(--med-bg)}
  .rec.danger{border-left:4px solid var(--hi);background:var(--hi-bg)}
  .rec.soft{border-left:4px solid var(--str)}
  .rec .rk{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  .rec.warn .rk{color:var(--med)} .rec.danger .rk{color:var(--hi)} .rec.soft .rk{color:var(--str)}
  .rec h3{font-family:var(--serif);font-weight:600;font-size:19px;margin:0 0 8px}
  .rec p{margin:0 0 10px;font-size:15px;color:var(--ink)}
  .rec p.m{color:var(--muted)}
  .rec p:last-child{margin-bottom:0}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  @media (max-width:540px){.two{grid-template-columns:1fr}}
  .mini{border:1px dashed var(--border-strong);border-radius:10px;padding:11px 12px;background:var(--surface)}
  .mini .mh{font-weight:650;font-size:14px;margin-bottom:3px}
  .mini .md{font-size:13px;color:var(--muted)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
  .sx{font-family:var(--mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent-ink);border-radius:7px;padding:4px 9px}

  .check{list-style:none;padding:0;margin:8px 0 0}
  .check li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--border);font-size:15px}
  .check li:first-child{border-top:none}
  .check .cx{flex:none;width:22px;height:22px;border-radius:6px;background:var(--str-bg);color:var(--str);display:grid;place-items:center;margin-top:1px}
  .check li b{font-weight:650}
  .check li span.d{color:var(--muted);font-size:13.5px;display:block}

  ol.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
  ol.steps li{counter-increment:s;position:relative;padding-left:40px;font-size:15px}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-family:var(--serif);font-weight:600;display:grid;place-items:center;font-size:14px}
  ol.steps li b{font-weight:650}
  ol.steps .d{color:var(--muted);font-size:13.5px}

  .reflinks{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:14.5px}

  .sectitle{font-family:var(--sans);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:30px 0 12px}

  .rdisc{font-size:12.5px;color:var(--faint);border-top:1px solid var(--border);margin-top:30px;padding-top:16px}

  .anim{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  @media print{
    .stepper,.nav,.brand .kick,.no-print{display:none!important}
    .card{border:none;box-shadow:none;padding:0}
    body{font-size:12pt}
    .rec{break-inside:avoid}
  }
</style>

<div class="app">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
    </span>
    <span class="kick">Clean Air Act · Treated as a State</span>
  </div>
  <h1>Should our Tribe seek TAS — and for what?</h1>
  <p class="sub">A guided decision tool for Tribal air-program staff, leadership, and Council. Answer a few questions about your lands and goals; get a tailored pathway with the specific Clean Air Act sections that fit.</p>

  <nav class="stepper" id="stepper" aria-label="Progress"></nav>

  <main id="stage" aria-live="polite"></main>
</div>

<script>
(function(){
  var stage = document.getElementById('stage');
  var stepperEl = document.getElementById('stepper');
  var state = {};
  var history = [];      // stack of previous step ids
  var current = 'intro';

  var STAGES = [
    {key:'boundaries', lab:'Boundaries'},
    {key:'ownSources', lab:'Sources'},
    {key:'outside',    lab:'Voice'},
    {key:'capacity',   lab:'Capacity'},
    {key:'results',    lab:'Result'}
  ];
  function stageIndexFor(step){
    if(step==='intro') return -1;
    if(step==='boundaries'||step==='disputedChoice') return 0;
    if(step==='ownSources') return 1;
    if(step==='outside') return 2;
    if(step==='capacity') return 3;
    if(step==='results') return 4;
    return -1;
  }
  function renderStepper(){
    var idx = stageIndexFor(current);
    var html='';
    for(var i=0;i<STAGES.length;i++){
      var cls = i<idx ? 'done' : (i===idx ? 'active' : '');
      html += '<div class="st '+cls+'"><span class="dot">'+(i<idx?'✓':(i+1))+'</span><span class="lab">'+STAGES[i].lab+'</span></div>';
      if(i<STAGES.length-1) html += '<span class="bar"></span>';
    }
    stepperEl.innerHTML = html;
  }

  var ARROW = '<svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var TICK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function opt(key,val,title,desc){
    return '<button class="opt" data-key="'+key+'" data-val="'+val+'">'
      + '<span class="tick" aria-hidden="true">'+TICK+'</span>'
      + '<span><span class="ot">'+title+'</span><span class="od">'+desc+'</span></span>'
      + ARROW + '</button>';
  }
  function backBtn(){
    return history.length ? '<button class="btn ghost" data-act="back">◀ Back</button>' : '';
  }

  // ---- step definitions ----
  function stepIntro(){
    return '<div class="card anim">'
      + '<p class="lede">This tool walks through the same questions EPA and your counsel would ask, in plain language. It reflects the eligibility criteria at <span style="font-family:var(--mono);font-size:.9em">40 CFR Part 49</span> and maps your situation to the Clean Air Act sections you may want to pursue.</p>'
      + '<div class="factrow">'
        + '<div class="fact"><div class="fh">~5 questions</div><div class="fd">About 3 minutes.</div></div>'
        + '<div class="fact"><div class="fh">Tailored result</div><div class="fd">The exact CAA sections that fit your goals.</div></div>'
        + '<div class="fact"><div class="fh">Shareable</div><div class="fd">Print or save the result for Council.</div></div>'
      + '</div>'
      + '<div class="nav"><button class="btn solid" data-act="start">Start →</button></div>'
      + '<p class="disc">This tool is general information to support your discussion — it is not legal advice. TAS decisions affect Tribal sovereignty and jurisdiction; coordinate closely with Tribal leadership, Council, and legal counsel before applying.</p>'
      + '</div>';
  }

  function stepBoundaries(){
    return '<div class="card anim">'
      + '<p class="qeyebrow">Question 1 of 4 · Boundaries</p>'
      + '<h2 class="qtitle">Are any of your Tribe’s jurisdictional boundaries currently disputed?</h2>'
      + '<p class="qhelp">For a reservation, this is the exterior boundary. For off-reservation areas, it’s the legal basis for your jurisdiction. When you apply for TAS, EPA must share your boundary showing with neighboring state and local air agencies, who may comment on it.</p>'
      + '<div class="opts">'
        + opt('boundaries','clear','No — our boundaries are clear','No known dispute over our reservation boundary or jurisdictional basis.')
        + opt('boundaries','disputed','Yes — some or all are disputed','One or more neighboring governments contest our boundaries or jurisdiction.')
        + opt('boundaries','unsure','We’re not sure yet','We haven’t confirmed this with counsel. We’ll treat it cautiously.')
      + '</div>'
      + '<div class="nav">'+backBtn()+'</div>'
      + '</div>';
  }

  function stepDisputedChoice(){
    var note = state.boundaries==='unsure'
      ? 'Until counsel confirms your boundaries are undisputed, it is safest to plan as though a question exists.'
      : 'Because a boundary question exists, weigh the strategic risk carefully.';
    return '<div class="card anim">'
      + '<p class="qeyebrow">Question 1 · Boundary risk</p>'
      + '<h2 class="qtitle">How would you like to proceed?</h2>'
      + '<div class="riskbox"><div class="rh">⚠ Understand the risk first</div>'
        + '<p>'+note+' EPA must provide your application and boundary showing to the appropriate state and local air agencies. They may comment and, after approval, challenge your boundaries in court. An adverse ruling could <b>narrow the CAA regulatory jurisdiction EPA recognizes</b> for your Tribe. This does <b>not</b> affect land title or ownership — but it is a real strategic decision for Council and counsel.</p></div>'
      + '<div class="opts">'
        + opt('disputedChoice','undisputed','Pursue TAS for undisputed areas only','Apply now over clearly-undisputed lands, and affirm the disputed areas remain claimed but excluded for now.')
        + opt('disputedChoice','full','Pursue TAS for our full claimed area','Accept the litigation risk and proceed with the full jurisdictional showing.')
        + opt('disputedChoice','decline','Don’t pursue TAS right now','Use non-TAS pathways instead — we’ll show you the alternatives.')
      + '</div>'
      + '<div class="nav">'+backBtn()+'</div>'
      + '</div>';
  }

  function stepOwnSources(){
    return '<div class="card anim">'
      + '<p class="qeyebrow">Question 2 of 4 · Sources in your jurisdiction</p>'
      + '<h2 class="qtitle">How many air-pollution sources are within your jurisdiction?</h2>'
      + '<p class="qhelp">Sources include factories, power plants, large boilers, and similar permitted or permittable facilities on your lands.</p>'
      + '<div class="opts">'
        + opt('ownSources','many','Many','Multiple significant sources we may want to permit, inspect, and enforce.')
        + opt('ownSources','few','A few, or a localized issue','A small number of sources — or something like wood smoke we’d address with an ordinance.')
        + opt('ownSources','none','None or very few','Little or no industrial activity on our lands.')
      + '</div>'
      + '<div class="nav">'+backBtn()+'</div>'
      + '</div>';
  }

  function stepOutside(){
    return '<div class="card anim">'
      + '<p class="qeyebrow">Question 3 of 4 · A voice next door</p>'
      + '<h2 class="qtitle">Do outside sources affect your air — or do you want a formal voice in nearby permits and plans?</h2>'
      + '<p class="qhelp">This is the Clean Air Act “good neighbor” role: early review of, and standing to comment on, neighboring states’ implementation plans and permits that could impact your air quality.</p>'
      + '<div class="opts">'
        + opt('outside','yes','Yes','Outside sources impact us, or we want early review of others’ plans and permits.')
        + opt('outside','no','No','Not a priority for us right now.')
      + '</div>'
      + '<div class="nav">'+backBtn()+'</div>'
      + '</div>';
  }

  function stepCapacity(){
    return '<div class="card anim">'
      + '<p class="qeyebrow">Question 4 of 4 · Capacity</p>'
      + '<h2 class="qtitle">Do you currently have the capacity to run an air program?</h2>'
      + '<p class="qhelp">Staffing and data skills, plus the executive, legislative, and judicial mechanisms to administer and enforce a program. Lacking capacity does <b>not</b> disqualify you — you may submit a plan showing how you will build it.</p>'
      + '<div class="opts">'
        + opt('capacity','yes','Yes, we’re ready','We have staff and the governmental mechanisms in place.')
        + opt('capacity','build','Not yet — we’d need to build it','We’d grow into it, take delegation, or partner with others.')
        + opt('capacity','unsure','Unsure','We haven’t assessed this yet.')
      + '</div>'
      + '<div class="nav">'+backBtn()+'</div>'
      + '</div>';
  }

  // ---- results ----
  var SECT_MANY = ['§110 TIP','O₃ plans §§181–185','PM plans §§188–189','SO₂/NO₂/Pb §§191–192','CO plans §§186–187','Regional haze §169A','PSD §165','NSR §173','§167 enforcement','Title V §§501–507','§111 NSPS','§112 air toxics','§114 records','§129 combustion','§303 emergency'];
  var SECT_FEW  = ['§110 TIP','PM NAAQS'];
  var SECT_PART = ['§126(a)/(b)','§110(a)(2)(D)(i)','§505(a)','§105 grants','§319 monitoring','§107(d) designations'];

  function chips(arr){
    var h='<div class="chips">';
    for(var i=0;i<arr.length;i++) h+='<span class="sx">'+arr[i]+'</span>';
    return h+'</div>';
  }

  function labelFor(key,val){
    var map={
      boundaries:{clear:'Boundaries clear',disputed:'Boundaries disputed',unsure:'Boundaries unconfirmed'},
      disputedChoice:{undisputed:'Undisputed areas only',full:'Full claimed area',decline:'Declining TAS for now'},
      ownSources:{many:'Many sources',few:'A few sources',none:'No/few sources'},
      outside:{yes:'Wants a voice next door',no:'No outside concern'},
      capacity:{yes:'Ready',build:'Building capacity',unsure:'Capacity unsure'}
    };
    return (map[key]&&map[key][val])||val;
  }

  function stepResults(){
    var declined = state.disputedChoice==='decline';
    var regulatory = !declined && (state.ownSources==='many' || state.ownSources==='few');
    var participatory = !declined && state.outside==='yes';
    var lowActivity = !declined && state.ownSources==='none' && state.outside==='no';
    var disputed = state.boundaries==='disputed' || state.boundaries==='unsure';
    var buildCap = !declined && (state.capacity==='build' || state.capacity==='unsure');

    // headline
    var vtitle, vsub;
    if(declined){
      vtitle='A non-TAS pathway fits best right now';
      vsub='You can protect your air and build capacity without TAS, and revisit once the boundary question is resolved.';
    } else if(regulatory && participatory){
      vtitle='Pursue Regulatory + Participatory TAS';
      vsub='You have sources to manage and reasons to influence what happens next door — seek both roles. They are not mutually exclusive.';
    } else if(regulatory){
      vtitle='Pursue Regulatory TAS';
      vsub='Become the primary implementing authority for the air-pollution sources in your jurisdiction.';
    } else if(participatory){
      vtitle='Pursue Participatory (good-neighbor) TAS';
      vsub='Get a formal, early voice in the state and local decisions that affect your air quality.';
    } else if(lowActivity){
      vtitle='TAS may offer limited near-term benefit';
      vsub='With few sources and no outside concern, non-TAS programs may serve you now — but the option stays open as things change.';
    } else {
      vtitle='Consider your TAS options below';
      vsub='Here is what fits the answers you gave.';
    }

    var h = '<div class="card anim">';

    // recap
    h += '<div class="rhead">'
      + '<span class="verdict-pill">Your tailored result</span>'
      + '<h2 class="rtitle">'+vtitle+'</h2>'
      + '<p class="rsub">'+vsub+'</p>'
      + '</div>';
    h += '<div class="recap">';
    var order=['boundaries','disputedChoice','ownSources','outside','capacity'];
    for(var i=0;i<order.length;i++){ if(state[order[i]]) h+='<span class="rc">'+labelFor(order[i],state[order[i]])+'</span>'; }
    h += '</div>';

    // risk banner
    if(disputed){
      h += '<div class="rec danger"><div class="rk">Keep in view</div><h3>Your boundary showing carries risk</h3>'
        + '<p>Because a boundary question exists, your application will be shared with neighboring agencies who may challenge it. An adverse ruling could narrow your recognized CAA regulatory jurisdiction (not your land title). '
        + (state.disputedChoice==='undisputed' ? 'Applying over <b>undisputed areas only</b> is the lower-risk route you chose — be sure to affirm the excluded areas remain claimed.' : (state.disputedChoice==='full' ? 'You chose to proceed over the <b>full claimed area</b> — have counsel prepare for a possible challenge.' : 'Resolve or scope this with counsel before filing.'))
        + '</p></div>';
    }

    h += '<div class="sectitle">Recommended pathway'+((regulatory&&participatory)?'s':'')+'</div>';

    // regulatory card
    if(regulatory){
      if(state.ownSources==='many'){
        h += '<div class="rec key"><div class="rk">Regulatory TAS</div><h3>Be the primary implementing authority</h3>'
          + '<p class="m">Develop and run the programs that permit, inspect, and enforce on the sources in your jurisdiction. You choose <b>how</b>:</p>'
          + '<div class="two">'
            + '<div class="mini"><div class="mh">Develop your own programs</div><div class="md">EPA approves them; you tailor the rules and are the primary enforcer. Once approved they are federally enforceable.</div></div>'
            + '<div class="mini"><div class="mh">Take delegation of federal rules</div><div class="md">No rule-writing — use existing federal rules (40 CFR part 71). You permit &amp; inspect; enforcement is referred to EPA. A good capacity-building first step.</div></div>'
          + '</div>'
          + '<p class="m" style="margin-top:8px">Sections you may seek:</p>'+chips(SECT_MANY)
          + '</div>';
      } else {
        h += '<div class="rec key"><div class="rk">Targeted Regulatory TAS</div><h3>Address a specific, localized issue</h3>'
          + '<p class="m">Even with only a few sources, a focused program can help — for example, a burning ordinance for wood smoke under a Tribal Implementation Plan.</p>'
          + chips(SECT_FEW)
          + '</div>';
      }
    }

    // participatory card
    if(participatory){
      h += '<div class="rec key"><div class="rk">Participatory TAS</div><h3>A formal “good neighbor” voice</h3>'
        + '<p class="m">Get early review of, and standing to comment on, neighboring states’ plans and permits — and petition EPA when outside sources affect your air.</p>'
        + chips(SECT_PART)
        + '</div>';
    }

    // low activity / declined
    if(lowActivity){
      h += '<div class="rec soft"><div class="rk">Worth knowing</div><h3>You have strong options without TAS today</h3>'
        + '<p class="m">With little source activity and no outside concern right now, the non-TAS pathways below may meet your needs. TAS remains available whenever sources appear or priorities shift.</p></div>';
    }

    // capacity card
    if(buildCap){
      h += '<div class="rec warn"><div class="rk">Capacity</div><h3>You can pursue TAS while you build capacity</h3>'
        + '<p>Not being “ready” is not a barrier. Options that lower the lift:</p>'
        + '<ul class="check" style="margin-top:2px">'
          + '<li><span class="cx">'+TICK+'</span><span><b>Submit a capability plan</b><span class="d">Show EPA how you’ll gain the technical expertise over time.</span></span></li>'
          + '<li><span class="cx">'+TICK+'</span><span><b>Take delegation instead of writing rules</b><span class="d">Use federal rules under 40 CFR part 71 to start.</span></span></li>'
          + '<li><span class="cx">'+TICK+'</span><span><b>Phase your program</b><span class="d">Seek TAS for a few sections now, add more later.</span></span></li>'
          + '<li><span class="cx">'+TICK+'</span><span><b>Partner or form a consortium</b><span class="d">Share staff and expertise with neighboring Tribes.</span></span></li>'
        + '</ul></div>';
    }

    // non-TAS options (always, framed by context)
    var nonTasHead = declined ? 'Your non-TAS pathway' : 'Also available — with or without TAS';
    h += '<div class="rec soft"><div class="rk">No TAS required</div><h3>'+nonTasHead+'</h3>'
      + '<ul class="check" style="margin-top:2px">'
        + '<li><span class="cx">'+TICK+'</span><span><b>Use your inherent Tribal authority</b><span class="d">Develop your own programs without submitting them to EPA for approval.</span></span></li>'
        + '<li><span class="cx">'+TICK+'</span><span><b>Grants</b><span class="d">§103 (investigative) grants need no TAS; §105 (programmatic) grants can flow through a Performance Partnership Grant (PPG). Note: §105 without TAS carries the standard 40% match; TAS reduces it to 5% (then up to 10%).</span></span></li>'
        + '<li><span class="cx">'+TICK+'</span><span><b>Run programs directly</b><span class="d">Monitoring, environmental education, indoor-air, and radon programs — all without TAS.</span></span></li>'
      + '</ul></div>';

    // eligibility checklist
    h += '<div class="sectitle">Before you file — the four eligibility criteria</div>'
      + '<div class="rec"><p class="m" style="margin-top:0">To be approved, your Tribe must be able to demonstrate all four (40 CFR §§ 49.6 / 49.7):</p>'
      + '<ul class="check">'
        + '<li><span class="cx">'+TICK+'</span><span><b>Federal recognition</b><span class="d">Listed by the Department of the Interior. § 49.6(a)</span></span></li>'
        + '<li><span class="cx">'+TICK+'</span><span><b>A governing body carrying out substantial duties</b><span class="d">A narrative on your government’s form, functions, and source of authority. § 49.6(b)</span></span></li>'
        + '<li><span class="cx">'+TICK+'</span><span><b>A jurisdictional showing</b><span class="d">Reservation: map + legal description of exterior boundaries. Off-reservation: a statement of legal counsel on the basis for jurisdiction. § 49.6(c)</span></span></li>'
        + '<li><span class="cx">'+TICK+'</span><span><b>Reasonable capability</b><span class="d">Or a plan to build it. § 49.6(d)</span></span></li>'
      + '</ul>'
      + '<p class="m" style="margin-bottom:0;margin-top:10px">Tip: you may reuse documentation from a prior TAS approval — including from another program — to satisfy some requirements (§ 49.7(a)(8)).</p>'
      + '</div>';

    // next steps
    h += '<div class="sectitle">Next steps</div>'
      + '<div class="rec"><ol class="steps">'
        + '<li><b>Bring this result to Tribal leadership, Council, and legal counsel.</b><div class="d">The boundary and sovereignty stakes make this a governance decision, not just a technical one.</div></li>'
        + '<li><b>Assemble your jurisdictional showing.</b><div class="d">Map and legal description (reservation), or a counsel statement (off-reservation).</div></li>'
        + '<li><b>Document your governing body and capability</b> — or a plan to build it.</li>'
        + '<li><b>Contact your EPA Regional Office Tribal air lead (or OAQPS).</b><div class="d">They can confirm scope and help streamline the application.</div></li>'
        + '<li><b>Review the detailed CAA-section summary</b> before finalizing which sections to seek.</li>'
      + '</ol>'
      + '<div class="reflinks" style="margin-top:14px">'
        + '<a href="https://www.epa.gov/tribal-air/clean-air-act-summary-content-applicability-tas-titles-i-iii-and-v" target="_blank" rel="noopener">CAA: Summary of content &amp; applicability for TAS (Titles I, III, V) ↗</a>'
        + '<a href="https://www.epa.gov/tribal-air/tribal-authority-rule-tar-under-clean-air-act" target="_blank" rel="noopener">Tribal Authority Rule (TAR) under the Clean Air Act ↗</a>'
      + '</div></div>';

    // actions
    h += '<div class="nav no-print">'+backBtn()
      + '<div class="spacer"></div>'
      + '<button class="btn" data-act="print">Print / Save PDF</button>'
      + '<button class="btn solid" data-act="restart">Start over</button>'
      + '</div>';

    h += '<p class="rdisc">This result is general information to support your discussion, not legal advice. Confirm all citations against 40 CFR Part 49 and the current Clean Air Act, and consult Tribal legal counsel before applying. Generated by an interactive planning tool.</p>';

    h += '</div>';
    return h;
  }

  var STEPS = {
    intro:stepIntro, boundaries:stepBoundaries, disputedChoice:stepDisputedChoice,
    ownSources:stepOwnSources, outside:stepOutside, capacity:stepCapacity, results:stepResults
  };

  function render(){
    renderStepper();
    stage.innerHTML = STEPS[current]();
    var firstOpt = stage.querySelector('.opt, .btn.solid');
    if(firstOpt && current!=='intro' && current!=='results'){ /* keep focus subtle */ }
    if(current!=='intro'){ window.scrollTo({top:0}); }
  }

  function go(next){ history.push(current); current=next; render(); }
  function back(){ if(history.length){ current=history.pop(); render(); } }

  function advance(key,val){
    state[key]=val;
    if(key==='boundaries'){ go(val==='clear' ? 'ownSources' : 'disputedChoice'); }
    else if(key==='disputedChoice'){ go(val==='decline' ? 'results' : 'ownSources'); }
    else if(key==='ownSources'){ go('outside'); }
    else if(key==='outside'){ go('capacity'); }
    else if(key==='capacity'){ go('results'); }
  }

  stage.addEventListener('click', function(e){
    var o = e.target.closest('.opt');
    if(o){ advance(o.getAttribute('data-key'), o.getAttribute('data-val')); return; }
    var b = e.target.closest('[data-act]');
    if(!b) return;
    var act = b.getAttribute('data-act');
    if(act==='start'){ go('boundaries'); }
    else if(act==='back'){ back(); }
    else if(act==='restart'){ state={}; history=[]; current='intro'; render(); }
    else if(act==='print'){ window.print(); }
  });

  render();
})();
</script>
