<meta charset="utf-8">
<title>TAS Decision Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  /* ---- BRAND PALETTE (from the brand guide) ----
     Slate #2b4552 · Olive #899163 · Orange #c98150 · Pink #c24e78
     Gold #dec26a · Sky #b8d0d8 · Neutrals #e5e8eb / #081b23
     The guide directs that the two neutrals replace pure black and white
     everywhere, text and backgrounds included, so #fff / #000 appear nowhere
     below. Values marked (tint) are mixes of a brand colour with a brand
     neutral — needed for card faces and semantic washes, which the guide does
     not enumerate. Nothing here is from outside the palette. */
  --bg:#e5e8eb;
  --surface:#f2f4f6; --surface-2:#e5e8eb;          /* (tint) card face lifts off the neutral page */
  --ink:#081b23; --muted:#4a5c66; --faint:#6f8290;
  --accent:#2b4552; --accent-soft:#b8d0d8; --accent-ink:#2b4552;
  --border:#c5ced4; --border-strong:#a6b4bd;       /* (tint) slate into the neutral */
  --risk:#a35f2c; --risk-bg:#f6e6d8; --risk-line:#c98150;
  --good:#5f6a3c; --good-bg:#e6e9db; --good-line:#899163;
  --alert:#a13760; --alert-bg:#f6e0e8;
  --gold:#dec26a;
  --on-accent:#e5e8eb; --amb:.5;
  --photo-op:.34;
  --sky-top:#cfdde3; --sky-mid:#dce3e7; --sky-bot:#e5e8eb;
  --cloud:rgba(242,244,246,.8); --haze:rgba(229,232,235,.62);
  --ridge-3:#cbd8de; --ridge-2:#b3c6cf; --ridge-1:#93aeba;
  --mote:rgba(43,69,82,.42);
  /* ---- BRAND TYPE ----
     Real families first, then the closest system stand-ins, because this page
     makes no external requests. Self-host Morvi / Gotham / Marion / Dongra as
     woff2 @font-face and the real faces take over with no other change. */
  --display:"Morvi","Haettenschweiler","Arial Narrow",Impact,system-ui,sans-serif;
  --sans:"Gotham Book","Gotham","Montserrat","Century Gothic","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Marion",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:var(--sans);                              /* labels are Gotham caps, not monospace */
  --track:.025em;                                  /* guide: tracking +25 */
  --sh1:0 1px 2px rgba(21,35,42,.05),0 6px 18px rgba(21,35,42,.06);
  --sh2:0 2px 8px rgba(21,35,42,.09),0 18px 40px rgba(21,35,42,.13);
  --ease:cubic-bezier(.22,.68,0,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#081b23;
    --surface:#11303d; --surface-2:#0d2530;
    --ink:#e5e8eb; --muted:#a8bac4; --faint:#7d919d;
    --accent:#b8d0d8; --accent-soft:#173a49; --accent-ink:#cfe3e9;
    --border:#1e4150; --border-strong:#2d5768;
    --risk:#dda06e; --risk-bg:#3a2716; --risk-line:#c98150;
    --good:#a3ab7a; --good-bg:#1e2a1a; --good-line:#899163;
    --alert:#d9739a; --alert-bg:#3a1a26;
    --gold:#dec26a;
    --on-accent:#081b23; --amb:.3;
    --photo-op:.2;
    --sky-top:#050f14; --sky-mid:#07161d; --sky-bot:#081b23;
    --cloud:rgba(184,208,216,.07); --haze:rgba(184,208,216,.05);
    --ridge-3:#0c222c; --ridge-2:#11303d; --ridge-1:#173d4d;
    --mote:rgba(184,208,216,.4);
    --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.38);
    --sh2:0 2px 8px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#081b23;
  --surface:#11303d; --surface-2:#0d2530;
  --ink:#e5e8eb; --muted:#a8bac4; --faint:#7d919d;
  --accent:#b8d0d8; --accent-soft:#173a49; --accent-ink:#cfe3e9;
  --border:#1e4150; --border-strong:#2d5768;
  --risk:#dda06e; --risk-bg:#3a2716; --risk-line:#c98150;
  --good:#a3ab7a; --good-bg:#1e2a1a; --good-line:#899163;
  --alert:#d9739a; --alert-bg:#3a1a26;
  --gold:#dec26a;
  --on-accent:#081b23; --amb:.3;
  --photo-op:.2;
  --sky-top:#050f14; --sky-mid:#07161d; --sky-bot:#081b23;
  --cloud:rgba(184,208,216,.07); --haze:rgba(184,208,216,.05);
  --ridge-3:#0c222c; --ridge-2:#11303d; --ridge-1:#173d4d;
  --mote:rgba(184,208,216,.4);
  --sh1:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.38);
  --sh2:0 2px 8px rgba(0,0,0,.4),0 20px 44px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
/* Controls and chrome are Gotham; running text is Marion. */
button,input,select,.btn,.notice,.hint{font-family:var(--sans)}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-ink)}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* ===========================================================================
   ENVIRONMENTAL BACKDROP
   Layered ridgelines receding into haze — atmospheric perspective is the
   Clean Air Act's own subject (regional haze, §169A visibility). Sky wash,
   slow cloud banks, and drifting air motes sit behind everything at low
   contrast so card text stays fully legible.
   ========================================================================= */
.env{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;contain:paint}

/* sky wash */
.env .sky{position:absolute;inset:0;
  background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 46%,var(--sky-bot) 100%)}

/* slow cloud banks */
.env .clouds span{position:absolute;display:block;border-radius:50%;
  background:radial-gradient(ellipse 58% 46% at 50% 50%,var(--cloud) 0%,transparent 74%);
  opacity:calc(var(--amb) * .78);will-change:transform}
.env .clouds span:nth-child(1){width:62vw;height:17vh;left:-18vw;top:9vh;animation:cloud1 132s linear infinite}
.env .clouds span:nth-child(2){width:48vw;height:13vh;left:38vw;top:22vh;animation:cloud2 168s linear infinite}
.env .clouds span:nth-child(3){width:70vw;height:20vh;left:12vw;top:2vh;animation:cloud3 204s linear infinite}
@keyframes cloud1{0%{transform:translateX(-14vw)}50%{transform:translateX(118vw)}50.01%{transform:translateX(-70vw)}100%{transform:translateX(-14vw)}}
@keyframes cloud2{0%{transform:translateX(-60vw)}100%{transform:translateX(108vw)}}
@keyframes cloud3{0%{transform:translateX(-82vw)}100%{transform:translateX(100vw)}}

/* the haze band the Act exists to clear */
.env .haze{position:absolute;left:0;right:0;bottom:20%;height:26%;
  background:linear-gradient(to bottom,transparent,var(--haze) 62%,transparent);
  opacity:calc(var(--amb) * 1.15)}

/* ridgelines, far to near */
.env .ridges{position:absolute;left:0;right:0;bottom:0;width:100%;height:46vh;min-height:260px;display:block}
.env .ridges path{transition:fill .4s}
.env .ridges .r3{fill:var(--ridge-3)}
.env .ridges .r2{fill:var(--ridge-2)}
.env .ridges .r1{fill:var(--ridge-1)}

/* drifting air motes */
.env .motes span{position:absolute;bottom:2vh;display:block;width:2px;height:2px;border-radius:50%;
  background:var(--mote);opacity:0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) translateX(0);opacity:0}
  18%{opacity:calc(var(--amb) * .45)}
  78%{opacity:calc(var(--amb) * .3)}
  100%{transform:translateY(-42vh) translateX(3vw);opacity:0}
}
.env .motes span:nth-child(1){left:11%;animation-duration:126s;animation-delay:0s}
.env .motes span:nth-child(2){left:29%;animation-duration:148s;animation-delay:22s}
.env .motes span:nth-child(3){left:44%;animation-duration:114s;animation-delay:47s}
.env .motes span:nth-child(4){left:61%;animation-duration:158s;animation-delay:13s}
.env .motes span:nth-child(5){left:76%;animation-duration:132s;animation-delay:63s}
.env .motes span:nth-child(6){left:91%;animation-duration:142s;animation-delay:36s}


/* ---- optional photograph ----
   Drop a file named land.jpg (or .png / .webp — see README) beside this page
   and it becomes the horizon. Nothing here 404s loudly: if the file is absent
   the background simply does not paint and the drawn ridgelines below show
   through, so the page is complete either way.

   The treatment is deliberate. The image is masked away toward the top, where
   the cards live, desaturated toward the brand palette and held at low opacity,
   so it can never compete with 13px text sitting on top of it. */
.env .photo{position:absolute;inset:0;
  background-image:url("land.jpg");background-size:cover;background-position:50% 76%;
  opacity:var(--photo-op);filter:saturate(.5) contrast(.9) brightness(1.02);
  -webkit-mask-image:linear-gradient(to top,#000 0%,#000 34%,transparent 78%);
  mask-image:linear-gradient(to top,#000 0%,#000 34%,transparent 78%)}
/* pulls whatever the photo is toward the brand neutrals */
.env .photo::after{content:'';position:absolute;inset:0;
  background:linear-gradient(to top,var(--sky-bot) 0%,transparent 55%)}

/* ---- arriving at a result ----
   A sunrise rather than confetti. This tool ends a sovereignty decision, so the
   moment is marked in the language the page already speaks: warm light rising
   behind the ridgelines, and seed-light carried up on the air. */
.env .bloom{position:absolute;left:50%;bottom:-6%;width:170vw;height:92vh;
  transform:translateX(-50%);pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 44% 54% at 50% 100%,
    rgba(255,236,176,.95) 0%,var(--gold) 18%,rgba(222,194,106,.55) 40%,rgba(222,194,106,0) 72%);
  animation:bloomUp 4.4s cubic-bezier(.16,.8,.3,1) forwards}
@keyframes bloomUp{
  0%{opacity:0;transform:translateX(-50%) translateY(22%) scale(.86)}
  12%{opacity:.95}
  40%{opacity:.8}
  72%{opacity:.42}
  100%{opacity:0;transform:translateX(-50%) translateY(-6%) scale(1.1)}
}
/* a single wash of warm light over the whole scene, so the moment registers
   even if the reader is looking at the top of the canvas */
.env .flash{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:linear-gradient(to top,rgba(222,194,106,.5) 0%,rgba(222,194,106,.16) 38%,transparent 72%);
  animation:flashUp 2.6s ease-out forwards}
@keyframes flashUp{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.env .sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.env .sparks span{position:absolute;bottom:4%;display:block;width:7px;height:7px;border-radius:50%;
  background:var(--gold);opacity:0;
  box-shadow:0 0 10px 3px rgba(222,194,106,.75);
  animation:sparkUp 3.8s cubic-bezier(.25,.6,.3,1) forwards;
  animation-delay:calc(var(--i,0) * 55ms)}
.env .sparks span:nth-child(3n){background:var(--good-line);width:5px;height:5px;
  box-shadow:0 0 9px 2px rgba(137,145,99,.6)}
.env .sparks span:nth-child(4n){background:#fff3d0;width:6px;height:6px;
  box-shadow:0 0 12px 3px rgba(255,243,208,.8)}
@keyframes sparkUp{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.4)}
  10%{opacity:1;transform:translate3d(0,-6vh,0) scale(1.15)}
  65%{opacity:.85}
  100%{opacity:0;transform:translate3d(var(--dx,3vw),-88vh,0) scale(.7)}
}
/* the card you arrived at catches the light too */
.tnode.result.arrived{animation:arrivedGlow 2.8s ease-out}
@keyframes arrivedGlow{
  0%{box-shadow:0 0 0 0 rgba(222,194,106,0)}
  18%{box-shadow:0 0 0 14px rgba(222,194,106,.55),0 0 40px 12px rgba(222,194,106,.5)}
  100%{box-shadow:0 0 0 0 rgba(222,194,106,0)}
}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:10px clamp(12px,2.5vw,20px);
  background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--sh1);z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mk{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent)}
.brand .mk svg{width:17px;height:17px}
.brand .kk{font-family:var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);display:block;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand h1{font-family:var(--display);font-weight:400;font-size:19px;margin:0;line-height:1.15;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:7px;flex:none}
@media (max-width:780px){ .brand .kk{display:none} .brand h1{font-size:15px} }
@media (max-width:440px){ .brand .mk{display:none} }

.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .18s,color .18s,transform .12s,box-shadow .18s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px);box-shadow:var(--sh1)}
.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.solid:hover{color:var(--on-accent);filter:brightness(1.07)}
.btn.icon{padding:7px 9px}
.btn svg{width:14px;height:14px;flex:none}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
/* a state indicator, so it snaps rather than transitions */
#btnSound .slash{opacity:0}
#btnSound.muted .slash{opacity:1}
#btnSound.muted .wave1,#btnSound.muted .wave2{opacity:0}
#btnSound.muted{color:var(--faint)}
@media (max-width:700px){ #btnSound .sndLabel{display:none} }

.rail{flex:none;height:3px;background:var(--surface-2);position:relative;overflow:hidden;z-index:5}
.rail i{position:absolute;inset:0 auto 0 0;width:0%;display:block;
  background:linear-gradient(90deg,var(--accent),var(--good-line) 62%,var(--gold));transition:width .7s var(--ease)}

/* stage */
.stage{flex:1;position:relative;min-height:0;overflow:hidden;cursor:grab;perspective:1500px;perspective-origin:50% 42%}
.stage.grabbing{cursor:grabbing}
.viewport{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;transform-style:preserve-3d}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.nodes{position:absolute;left:0;top:0;transform-style:preserve-3d}

/* ---------- tree nodes ---------- */
/* Depth encodes relevance: what you must act on comes forward, what you
   ruled out recedes and softens. Every transform is composed from these
   custom properties so a hover lift can never clobber a state's depth. */
.tnode{--z:0px; --lift:0px; --rx:0deg; --ry:0deg; --sc:1;
  position:absolute;background:var(--surface);border:1.5px solid var(--border-strong);
  border-radius:13px;box-shadow:var(--sh1);padding:12px 14px;
  transform:translate3d(0,var(--lift),var(--z)) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--sc));
  transform-style:preserve-3d;backface-visibility:hidden;
  transition:opacity .4s var(--ease),border-color .22s,box-shadow .22s,
             transform .26s var(--ease),filter .35s}
.tnode .tag{font-family:var(--sans);font-weight:600;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);display:block;margin-bottom:4px}
.tnode .ttl{font-weight:650;font-size:14.5px;line-height:1.3;display:block}
.tnode .sub{color:var(--muted);font-size:12.5px;margin-top:4px;display:block}

/* question node */
.tnode.q{border-color:var(--accent);border-width:2px}
/* Questions are full sentences, so they stay in Marion. Setting them in the
   all-caps display face would wreck readability at this length. */
.tnode.q .ttl{font-family:var(--serif);font-weight:600;font-size:17.5px;line-height:1.26}
.tnode.q.risky{border-color:var(--risk-line);background:var(--risk-bg)}
.tnode.q.risky .tag{color:var(--risk)}
.tnode.q{box-shadow:var(--sh1)}
/* The question awaiting an answer is the nearest thing to the reader. It earns
   that through elevation, not translateZ: anything carrying text the reader
   must READ stays at Z:0 so the glyphs are never resampled by perspective. */
.tnode.q.active{box-shadow:0 0 0 4px var(--accent-soft),var(--sh2)}

/* option node */
.tnode.opt{cursor:pointer;overflow:hidden}
.tnode.opt .tag{color:var(--faint)}
.tnode.opt::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(100deg,transparent,var(--accent-soft),transparent);
  transform:translateX(-110%);transition:transform .55s var(--ease);opacity:.75}
.tnode.opt:hover{--lift:-3px;border-color:var(--accent);box-shadow:var(--sh2)}
.tnode.opt:hover::before{transform:translateX(110%)}
.tnode.opt:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-color:var(--accent)}
.tnode.opt .kb{position:absolute;top:8px;right:9px;width:18px;height:18px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);transition:.18s}
.tnode.opt:hover .kb{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* chosen / not taken */
.tnode.chosen{border-color:var(--good);background:var(--good-bg);cursor:pointer}
.tnode.chosen .tag{color:var(--good)}
.tnode.chosen .kb{display:none}
.tnode.chosen::after{content:'✓';position:absolute;top:7px;right:10px;color:var(--good);font-weight:700;font-size:13px}
/* the road not taken: pushed back behind the live path and thrown slightly
   out of focus, so relevance reads before you even parse the label */
.tnode.notaken{--z:-38px;opacity:.5;filter:saturate(.28) blur(.7px);cursor:pointer}
/* on hover a discarded branch comes back to the front and to full focus —
   the one place a node crosses between depth planes, and it lands at Z:0 */
.tnode.notaken:hover{--lift:-3px;--z:0px;opacity:1;filter:none;border-color:var(--accent);box-shadow:var(--sh2)}
.tnode.notaken .kb{display:none}
.tnode.notaken::after{content:'switch';position:absolute;bottom:6px;right:9px;font-family:var(--mono);
  font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .2s}
.tnode.notaken:hover::after{opacity:1}
/* an answered question invites you back to it */
.tnode.q.reopenable{cursor:pointer}
.tnode.q.reopenable:hover{--lift:-3px;border-color:var(--accent);box-shadow:var(--sh2)}
/* the way back, always shown on a question you have already answered */
.rewind{position:absolute;top:-11px;right:-11px;width:24px;height:24px;border-radius:50%;
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--muted);
  font-family:var(--sans);font-size:12px;line-height:1;cursor:pointer;padding:0;
  display:grid;place-items:center;box-shadow:var(--sh1);
  transition:background .16s,border-color .16s,color .16s,transform .16s var(--ease);z-index:5}
.rewind:hover{background:var(--alert);border-color:var(--alert);color:var(--on-accent);transform:scale(1.15)}
.rewind:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.tnode.q.reopenable::after{content:'answer again';position:absolute;bottom:7px;right:12px;
  font-family:var(--sans);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);opacity:0;transition:opacity .2s}
.tnode.q.reopenable:hover::after{opacity:1}
.tnode.q.reopenable{padding-bottom:22px}

/* outcome leaf */
.tnode.out{border-color:var(--good-line);background:var(--good-bg);border-style:dashed}
.tnode.out .tag{color:var(--good)}

/* result leaf */
.tnode.result{border-color:var(--good);border-width:2px;background:var(--good-bg);cursor:pointer;text-align:left}
.tnode.result .ttl{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.12;
  text-transform:uppercase;letter-spacing:.015em}
.tnode.result .go{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  font-weight:700;color:var(--good);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
/* an unsized inline SVG defaults to 300x150 and blows the node open */
.tnode svg,.check .cx svg{width:13px;height:13px;flex:none}
.tnode.result{box-shadow:0 0 0 4px var(--good-bg),var(--sh2)}
.tnode.result:hover{--lift:-3px;box-shadow:0 0 0 5px var(--good-bg),var(--sh2)}

/* active pulse */
.tnode.active{box-shadow:0 0 0 4px var(--accent-soft),var(--sh2)}

/* entrance */
.tnode.pre{opacity:0;--lift:18px;--sc:.965;--z:-40px}
/* A node arriving on the canvas eases in far more slowly than it reacts to a
   hover, so the branch has time to read as growing rather than appearing.
   Carried on its own class so hover and state changes stay quick. */
.tnode.entering{transition:opacity .8s var(--ease),transform .9s var(--ease)}

/* edges */
.edge{fill:none;stroke:var(--border-strong);stroke-width:3.2;stroke-linecap:round}
.edge.taken{stroke:var(--good);stroke-width:5}
.edge.dimmed{opacity:.3}
.edge.grant{stroke:var(--good-line);stroke-width:3.4;stroke-dasharray:6 5}
/* A limb draws itself before the node on the end of it arrives. Driven by
   inline dash values measured from the real curve, so it cannot be defeated by
   another rule's stroke-dasharray (the dashed pathway edges have one). */

/* controls */
.zoom,.hint{opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
body.running .zoom{opacity:1;pointer-events:auto}
body.running .hint{opacity:1}
.zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom .btn{background:var(--surface);box-shadow:var(--sh1)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:4;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:6px 15px;font-size:12.5px;color:var(--muted);
  box-shadow:var(--sh1);pointer-events:none;max-width:calc(100% - 140px);text-align:center}

/* ---------- standing disclaimer ----------
   The tree starts on load, so there is no intro screen left to carry the
   "not legal advice" framing. It lives here instead — in view for the whole
   session rather than on a card the reader dismisses once. */
.notice{flex:none;display:flex;align-items:baseline;gap:9px;z-index:5;
  padding:6px clamp(12px,2.5vw,20px);background:var(--surface-2);
  border-bottom:1px solid var(--border);font-size:11.5px;line-height:1.45;color:var(--muted)}
.notice b{flex:none;font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
@media (max-width:560px){ .notice b{display:none} }

/* ---------- result sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(12,22,26,.5);animation:fade .28s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .panel{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--sh2);display:flex;flex-direction:column;
  animation:slidein .4s var(--ease) both}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:620px){ .sheet .panel{width:100%;top:auto;height:88%;border-left:none;border-top:1px solid var(--border);border-radius:18px 18px 0 0;animation:slideup .4s var(--ease) both} }
@keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .head{flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sheet .head .kk{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--good);display:block}
.sheet .head h3{font-family:var(--display);font-weight:400;font-size:22px;margin:1px 0 0;line-height:1.1;
  text-transform:uppercase;letter-spacing:.015em}
.sheet .head .grow{flex:1}
.sheet .head .btn svg{width:13px;height:13px;flex:none}
.sheet .body{flex:1;overflow-y:auto;padding:18px}
/* ---------- bento result ----------
   The result is a set of independent answers, not a narrative, so it reads
   better as a board of tiles than as a scroll. Tiles that carry a list get
   the full width; short ones pair up. */
.sheet .body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;align-content:start}
.sheet .body>*{grid-column:1 / -1;margin:0}
.sheet .body .card{margin:0;height:100%}
.sheet .body .tile-half{grid-column:span 1}
@media (max-width:560px){ .sheet .body .tile-half{grid-column:1 / -1} }
.sheet .body .sectitle{margin:10px 0 0;align-self:end}
.sheet .body .card.stat{display:flex;flex-direction:column;justify-content:space-between}
.sheet .body .card.stat .big{font-family:var(--display);font-size:34px;font-weight:400;line-height:1;
  color:var(--accent);font-variant-numeric:tabular-nums;margin-top:6px}
.sheet .body .card.stat .lbl{font-size:12.5px;color:var(--muted);margin-top:4px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px 16px;margin:0 0 12px;box-shadow:var(--sh1)}
.card.key{border-left:4px solid var(--accent)}
.card.warn{border-left:4px solid var(--risk);background:var(--risk-bg)}
.card.danger{border-left:4px solid var(--alert);background:var(--alert-bg)}
.card.soft{border-left:4px solid var(--good)}
.card .rk{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:var(--track);text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.card.warn .rk{color:var(--risk)} .card.danger .rk{color:var(--alert)} .card.soft .rk{color:var(--good)}
.card h4{font-family:var(--serif);font-weight:600;font-size:17px;margin:0 0 7px;line-height:1.24}
.card p{margin:0 0 8px;font-size:14px} .card p.m{color:var(--muted)} .card p:last-child{margin-bottom:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}
@media (max-width:700px){ .two{grid-template-columns:1fr} }
.mini{border:1px dashed var(--border-strong);border-radius:9px;padding:10px 11px;background:var(--surface)}
.mini .mh{font-weight:650;font-size:13px;margin-bottom:2px}
.mini .md{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0}
.sx{font-family:var(--sans);font-weight:600;font-size:11.5px;background:var(--accent-soft);color:var(--accent-ink);border-radius:6px;padding:3px 7px}
.check{list-style:none;padding:0;margin:6px 0 0}
.check li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--border);font-size:13.5px}
.check li:first-child{border-top:none}
.check .cx{flex:none;width:19px;height:19px;border-radius:5px;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin-top:1px}
.check .cx svg{width:12px;height:12px}
.check li b{font-weight:650}
.check li span.d{color:var(--muted);font-size:12.5px;display:block}
ol.steps{counter-reset:s;list-style:none;padding:0;margin:6px 0 0;display:grid;gap:9px}
ol.steps li{counter-increment:s;position:relative;padding-left:34px;font-size:13.5px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:7px;
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:400;display:grid;place-items:center;font-size:14px}
ol.steps .d{color:var(--muted);font-size:12.5px}
/* the guide's SUB-HEADING: Gotham all-caps, tracking +25, in the orange */
.sectitle{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:var(--track);
  text-transform:uppercase;color:var(--risk-line);margin:22px 0 10px}
.reflinks{display:flex;flex-direction:column;gap:5px;margin-top:5px;font-size:13.5px}
.disc{font-size:12px;color:var(--faint);border-top:1px solid var(--border);margin-top:20px;padding-top:13px}

@media (prefers-reduced-motion:reduce){
  /* This setting asks for no large movement — not for no feedback. A blanket
     transition:none used to switch the whole grow sequence off, so the tree
     snapped open with every line already in place. Now the depth model
     flattens, the backdrop stops drifting and nothing slides or scales, but a
     limb still draws itself and its option still fades in after it: a line and
     a fade are not the kind of motion this setting protects against. */
  .tnode{--z:0px!important;--rx:0deg!important;--ry:0deg!important;
         --lift:0px!important;--sc:1!important}
  .stage{perspective:none!important}
  .tnode.entering{transition:opacity .4s linear!important}
  .tnode.notaken{opacity:.42!important;filter:saturate(.28)!important}
  .env .ridges{transform:none!important}
  .env .clouds span,.env .motes span{animation:none!important}
  .env .bloom,.env .sparks,.env .flash{display:none!important}
  .tnode.result.arrived{animation:none!important}
  .env .motes span{opacity:.5!important}
  .btn:hover,.tnode:hover{transform:none!important}
}

#printOut{display:none}
@media print{
  body{background:#fff;color:#000;overflow:visible}

  #printOut .pc,#printOut .psx{display:inline-block;border:1px solid #999;border-radius:8pt;padding:1pt 6pt;margin:2pt 3pt 2pt 0;font-size:9pt}
  #printOut .psx{font-family:var(--mono);border-radius:3pt;border-color:#bbb}
  #printOut ul{margin:4pt 0;padding-left:16pt} #printOut li{margin:3pt 0}
  #printOut .pd{font-size:8.5pt;color:#444;border-top:1px solid #999;margin-top:14pt;padding-top:6pt}
  #printOut .ptree{display:block;max-width:520px;margin:6pt 0 10pt;break-inside:avoid;page-break-inside:avoid}
}

/* ===========================================================================
   SOUND
   Synthesised, so nothing is fetched. Voices are soft and filtered rather than
   bright, and the notes are a pentatonic run — successive options can never
   land on a dissonant interval. Kept quiet, and switchable, because this gets
   opened in meetings; the choice is remembered.
   ========================================================================= */
var AUDIO={ctx:null,master:null,on:true};
try{ AUDIO.on=localStorage.getItem('tas-sound')!=='off'; }catch(e){}

function audioCtx(){
  if(AUDIO.ctx) return AUDIO.ctx;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ AUDIO.ctx=new AC(); }catch(e){ return null; }
  AUDIO.master=AUDIO.ctx.createGain();
  AUDIO.master.gain.value=0.14;
  AUDIO.master.connect(AUDIO.ctx.destination);
  return AUDIO.ctx;
}
/* one soft, filtered voice with a plucked envelope */
function voice(o){
  if(!AUDIO.on) return;
  var ctx=audioCtx(); if(!ctx) return;
  if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }
  var t=ctx.currentTime+(o.delay||0), dur=o.dur||0.3;
  var osc=ctx.createOscillator(), g=ctx.createGain(), lp=ctx.createBiquadFilter();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.from,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  lp.type='lowpass';
  lp.frequency.setValueAtTime(o.cut||1800,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol||0.4,t+(o.attack||0.015));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(lp); lp.connect(g); g.connect(AUDIO.master);
  osc.start(t); osc.stop(t+dur+0.05);
}
/* C D E G A — no semitones, so any order stays consonant */
var PENTA=[523.25,587.33,659.25,783.99,880.00,1046.50];
function sndLine(){   voice({from:170,to:430,dur:0.30,type:'triangle',vol:0.16,cut:1100}); }
function sndNode(i){  voice({from:PENTA[i%PENTA.length],dur:0.42,type:'sine',vol:0.30,cut:2400});
                      voice({from:PENTA[i%PENTA.length]/2,dur:0.34,type:'sine',vol:0.10,cut:1200}); }
function sndChoose(){ voice({from:392,dur:0.20,type:'sine',vol:0.26,cut:1600});
                      voice({from:587.33,dur:0.30,type:'sine',vol:0.20,cut:1900,delay:0.07}); }
function sndResult(){ [523.25,659.25,783.99,1046.50].forEach(function(f,i){
                        voice({from:f,dur:0.85,type:'sine',vol:0.22,cut:2600,delay:i*0.10}); }); }
function sndRetract(){voice({from:520,to:190,dur:0.44,type:'triangle',vol:0.18,cut:1000}); }
/* the pentatonic run walked backwards, one note per limb as it withdraws */
function sndUnwind(i){
  var f=PENTA[(PENTA.length-1-((i>>1)%PENTA.length))];
  voice({from:f,dur:0.24,type:'sine',vol:0.16,cut:1600});
}

function setSound(on){
  AUDIO.on=on;
  try{ localStorage.setItem('tas-sound',on?'on':'off'); }catch(e){}
  var b=document.getElementById('btnSound');
  if(b){
    b.setAttribute('aria-pressed',String(on));
    b.title=on?'Sound on — click to mute':'Sound off — click to unmute';
    b.querySelector('.sndLabel').textContent=on?'Sound':'Muted';
    b.classList.toggle('muted',!on);

}

  {t:'CAA: Summary of content & applicability for TAS (Titles I, III, V)',u:'https://www.epa.gov/tribal-air/clean-air-act-summary-content-applicability-tas-titles-i-iii-and-v'},
  {t:'Tribal Authority Rule (TAR) under the Clean Air Act',u:'https://www.epa.gov/tribal-air/tribal-authority-rule-tar-under-clean-air-act'}

var DISC='General information to support your discussion — not legal advice, and not an official EPA product. Confirm all citations against 40 CFR Part 49 and the current Clean Air Act, and consult Tribal legal counsel before applying.';

/* ---------------------------------------------------------------------------

(function(){
  function adopt(d){
    if(!d) return;

    if(d.NONTAS) NONTAS=d.NONTAS;
    if(d.CRITERIA) CRITERIA=d.CRITERIA;
    if(d.NEXT) NEXT=d.NEXT;
    if(d.LINKS) LINKS=d.LINKS;
    if(typeof d.DISC==='string'&&d.DISC) DISC=d.DISC;
  }
  try{ adopt(window.TAS_TREE); }catch(e){}
  try{
    var raw=localStorage.getItem('tas-tree-draft');
    if(raw) adopt(JSON.parse(raw));
  }catch(e){}
})();

/* ===========================================================================
   STATE
   ========================================================================= */
var QW=330, OW=196, HGAP=18, VGAP=54;
var path=[], collected=[], started=false, terminal=null;
var stage=document.getElementById('stage'), vp=document.getElementById('viewport');
var nodesEl=document.getElementById('nodes'), edgesEl=document.getElementById('edges');
var railFill=document.getElementById('railFill'), hintEl=document.getElementById('hint');
var view={tx:0,ty:0,s:1};
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
/* A hidden tab cannot show a sequence, so it gets the finished tree. Reduced
   motion still gets the sequence, just without the movement — see the media
   query above. Timings shorten under it. */
function canAnimate(){ return !document.hidden; }
function motionScale(){ return reduce?0.6:1; }
var TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* Keep the tree on screen. Panning used to be unbounded, so a scroll or drag
   could carry the canvas into empty space with nothing to navigate back by.
   The tree is now held so it always overlaps the stage, with a small margin of
   breathing room; a tree smaller than the stage simply centres on that axis. */
var PAN_MARGIN=110;
function clampView(){
  if(!window.__tree) return;
  var r=stage.getBoundingClientRect();
  if(!r.width||!r.height) return;
  var W=window.__tree.w*view.s, H=window.__tree.h*view.s, m=PAN_MARGIN;
  var loX=r.width-m-W, hiX=m;
  view.tx=(loX>hiX)?(r.width-W)/2:Math.min(hiX,Math.max(loX,view.tx));
  var loY=r.height-m-H, hiY=m;
  view.ty=(loY>hiY)?(r.height-H)/2:Math.min(hiY,Math.max(loY,view.ty));
}
function applyView(){
  clampView();
  vp.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.s+')';
}

/* remaining questions on the shortest route, for an honest progress bar */
function remaining(id){
  if(!NODES[id]) return 0;
  var seen={},q=[[id,0]],best=99;
  while(q.length){
    var it=q.shift();
    if(!NODES[it[0]]){ best=Math.min(best,it[1]); continue; }
    if(seen[it[0]]) continue; seen[it[0]]=1;
    NODES[it[0]].a.forEach(function(a){ q.push([a.to,it[1]+1]); });
  }
  return best===99?0:best;
}

/* ===========================================================================
   BUILD THE TREE — walks the chosen path and lays out real nodes
   ========================================================================= */
function currentQuestion(){
  if(!path.length) return 'q1';
  var last=path[path.length-1];
  return NODES[last.node].a[last.ai].to;
}

function build(){
  nodesEl.innerHTML=''; edgesEl.innerHTML='';
  var rows=[];            /* [{items:[el...], y, h}] */
  var edges=[];
  var anchor=0;           /* x centre the next question hangs from */
  var chain=[];           /* questions to draw, in order */
  var qid='q1';
  for(var i=0;i<=path.length;i++){
    chain.push(qid);
    if(i<path.length){ qid=NODES[path[i].node].a[path[i].ai].to; if(!NODES[qid]) break; }
    else break;
  }

  var prevChosenEl=null;
  for(var li=0;li<chain.length;li++){
    var id=chain[li];
    if(!NODES[id]) break;
    var n=NODES[id];
    var answered=null;
    for(var k=0;k<path.length;k++) if(path[k].node===id) answered=path[k].ai;

    /* ---- question node ---- */
    var qEl=document.createElement('div');
    qEl.className='tnode q'+(n.risky?' risky':'')
      +(answered===null?' active':' reopenable');
    qEl.style.width=QW+'px';
    qEl.dataset.node=id;
    if(answered!==null){
      qEl.setAttribute('tabindex','0');
      qEl.setAttribute('role','button');
      qEl.setAttribute('aria-label','Go back to '+n.tag+' — '+n.q+'. Retracts the tree so you can answer it again.');
    }
    qEl.innerHTML='<span class="tag">'+esc(n.tag)+'</span><span class="ttl">'+esc(n.q)+'</span>'
      +(n.note&&answered===null?'<span class="sub">'+esc(n.note)+'</span>':'');
    if(answered!==null){
      /* the card is clickable as a whole, but the way back should be visible
         rather than something the reader has to discover by hovering */
      var back=document.createElement('button');
      back.type='button';
      back.className='rewind';
      back.innerHTML='&#10005;';
      back.title='Cut the tree back to this question and answer it again';
      back.setAttribute('aria-label','Cut the tree back to '+n.tag+' and answer it again');
      /* Take the card from the event, never from a captured variable. build()
         declares both `id` and `back` with var, so anything closed over in
         here is the LAST question in the chain — which made every x cut back
         to the same place, one step, instead of to its own question. */
      back.addEventListener('click',function(ev){
        ev.stopPropagation();
        var card=ev.currentTarget.closest('.tnode');
        if(card&&card.dataset.node) reopen(card.dataset.node);
      });
      back.addEventListener('pointerdown',function(ev){ ev.stopPropagation(); });
      qEl.appendChild(back);
    }
    nodesEl.appendChild(qEl);
    rows.push({items:[{el:qEl,cx:anchor}],kind:'q'});
    if(prevChosenEl) edges.push({from:prevChosenEl,to:qEl,taken:true});

    /* ---- option nodes fanned under it ---- */
    var optRow=[], total=n.a.length*OW+(n.a.length-1)*HGAP;
    var startX=anchor-total/2;
    var chosenEl=null;
    for(var ai=0;ai<n.a.length;ai++){
      var a=n.a[ai];
      var oEl=document.createElement('div');
      var state=(answered===null)?'':(answered===ai?' chosen':' notaken');
      oEl.className='tnode opt'+state;
      oEl.style.width=OW+'px';
      oEl.dataset.node=id; oEl.dataset.ai=String(ai);
      oEl.innerHTML='<span class="ttl">'+esc(a.label)+'</span>'
        +(a.grants?'<span class="sub">unlocks '+esc(OUT[a.grants].name)+'</span>':'')
        +(answered===null?'<span class="kb">'+(ai+1)+'</span>':'');
      oEl.setAttribute('tabindex','0'); oEl.setAttribute('role','button');
      oEl.setAttribute('aria-label',a.label
        +(answered===ai?' — your current choice'
          :(answered===null?'':' — switch the tree to this branch')));
      nodesEl.appendChild(oEl);
      var cx=startX+ai*(OW+HGAP)+OW/2;
      optRow.push({el:oEl,cx:cx});
      edges.push({from:qEl,to:oEl,taken:answered===ai,dimmed:answered!==null&&answered!==ai});
      /* No pathway leaf node here. What an answer unlocks is already said on
         the option itself and again in the result; a separate card only widened
         the tree and pushed the trunk off-centre. */
      if(answered===ai) chosenEl=oEl;
    }
    rows.push({items:optRow,kind:'opts'});
    if(chosenEl){ anchor=optRow.filter(function(o){return o.el===chosenEl;})[0].cx; prevChosenEl=chosenEl; }
    else { prevChosenEl=null; break; }
  }

  /* ---- terminal / result node ---- */
  var endId=currentQuestion();
  if(!NODES[endId] && path.length){
    terminal=endId;
    var v=verdict(endId);
    var rEl=document.createElement('div');
    rEl.className='tnode result active';
    rEl.style.width=(QW-20)+'px';
    rEl.id='resultNode';
    rEl.setAttribute('tabindex','0'); rEl.setAttribute('role','button');
    rEl.setAttribute('aria-label','Your result: '+v.t+'. Open the full result.');
    rEl.innerHTML='<span class="tag">Result</span><span class="ttl">'+esc(v.t)+'</span>'
      +'<span class="go">'+TICK+' Open full result</span>';
    nodesEl.appendChild(rEl);
    rows.push({items:[{el:rEl,cx:anchor}],kind:'result'});
    if(prevChosenEl) edges.push({from:prevChosenEl,to:rEl,taken:true});
  } else { terminal=null; }

  layout(rows,edges);
  document.getElementById('btnResult').hidden=!terminal;
  updateRail();
  updateHint();
}

/* measure, place, then draw the edges between real boxes */
function layout(rows,edges){
  var y=0, boxes=[];
  rows.forEach(function(row){
    var h=0;
    row.items.forEach(function(it){ h=Math.max(h,it.el.offsetHeight); });
    row.items.forEach(function(it){
      it.x=it.cx-it.el.offsetWidth/2; it.y=y;
      boxes.push(it);
    });
    row.h=h; row.y=y;
    y+=h+VGAP;
  });
  /* normalise so everything is positive, then place */
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  boxes.forEach(function(b){
    minX=Math.min(minX,b.x); minY=Math.min(minY,b.y);
    maxX=Math.max(maxX,b.x+b.el.offsetWidth); maxY=Math.max(maxY,b.y+b.el.offsetHeight);
  });
  var padX=40,padY=30;
  boxes.forEach(function(b){
    b.px=b.x-minX+padX; b.py=b.y-minY+padY;
    b.el.style.left=b.px+'px'; b.el.style.top=b.py+'px';
  });
  var W=maxX-minX+padX*2, H=maxY-minY+padY*2;
  edgesEl.setAttribute('width',W); edgesEl.setAttribute('height',H);
  edgesEl.setAttribute('viewBox','0 0 '+W+' '+H);
  window.__tree={w:W,h:H,boxes:boxes};

  function ctr(el){
    for(var i=0;i<boxes.length;i++) if(boxes[i].el===el) return boxes[i];
    return null;
  }
  edges.forEach(function(e){
    var a=ctr(e.from), b=ctr(e.to);
    if(!a||!b) return;
    var x1,y1,x2,y2,d;
    if(e.side){
      x1=a.px+a.el.offsetWidth; y1=a.py+a.el.offsetHeight/2;
      x2=b.px; y2=b.py+b.el.offsetHeight/2;
      var mx=(x1+x2)/2;
      d='M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2;
    } else {
      x1=a.px+a.el.offsetWidth/2; y1=a.py+a.el.offsetHeight;
      x2=b.px+b.el.offsetWidth/2; y2=b.py;
      var dy=Math.max(16,(y2-y1)/2);
      d='M'+x1+','+y1+' C'+x1+','+(y1+dy)+' '+x2+','+(y2-dy)+' '+x2+','+y2;
    }
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','edge'+(e.taken?' taken':'')+(e.dimmed?' dimmed':'')+(e.grant?' grant':''));
    p.setAttribute('d',d);
    /* pathLength normalises every curve to 1 unit, so a line draws in the same
       time whether it is a short hop or a long sweep across the canvas */
    p.setAttribute('pathLength','1');
    edgesEl.appendChild(p);
    b.el.__inEdge=p;               /* the one edge that feeds this node */
  });
}

/* ===========================================================================
   INTERACTION
   ========================================================================= */
function choose(nodeId,ai){
  sndChoose();
  var idx=-1;
  for(var i=0;i<path.length;i++) if(path[i].node===nodeId){ idx=i; break; }
  if(idx>=0) path=path.slice(0,idx);
  path.push({node:nodeId,ai:ai});
  collected=[];
  path.forEach(function(p){
    var g=NODES[p.node].a[p.ai].grants;
    if(g&&collected.indexOf(g)<0) collected.push(g);
  });
  grow();
}

/* rebuild, animating only what is new */
/* What a node IS, independent of the state it happens to be in. Keyed on the
   className before, an option that had merely turned green counted as brand
   new and replayed the whole grow animation. */
function nodeKey(el){
  var id=el.dataset.node||'';
  if(el.id==='resultNode') return 'result';
  if(el.classList.contains('out')) return 'leaf:'+((el.querySelector('.ttl')||{}).textContent||'');
  if(el.classList.contains('opt')) return 'opt:'+id+':'+(el.dataset.ai||'');
  return 'q:'+id;
}
/* The arrival, drawn once and cleaned up after itself. A sunrise rather than
   confetti: this tool ends a sovereignty decision, so the moment is marked in
   the language the page already speaks — warm light rising behind the
   ridgelines, and seed-light carried up on the air. */
var partyTimer=null;
function celebrate(){
  if(reduce||document.hidden) return;
  var env=document.querySelector('.env');
  if(!env||env.querySelector('.bloom')) return;
  var bloom=document.createElement('div'); bloom.className='bloom';
  var flash=document.createElement('div'); flash.className='flash';
  var sparks=document.createElement('div'); sparks.className='sparks';
  var node=document.getElementById('resultNode');
  if(node){ node.classList.add('arrived'); setTimeout(function(){ node.classList.remove('arrived'); },3000); }
  for(var i=0;i<40;i++){
    var sp=document.createElement('span');
    sp.style.left=(2+(i*7.3+((i*41)%17))%96)+'%';
    sp.style.setProperty('--i',i%18);
    sp.style.setProperty('--dx',(((i*29)%11)-5)+'vw');
    sparks.appendChild(sp);
  }
  env.appendChild(bloom); env.appendChild(flash); env.appendChild(sparks);
  clearTimeout(partyTimer);
  partyTimer=setTimeout(function(){
    [bloom,flash,sparks].forEach(function(el){ if(el.parentNode) el.parentNode.removeChild(el); });
  },5600);
}
function clearCelebration(){
  clearTimeout(partyTimer);
  Array.prototype.forEach.call(document.querySelectorAll('.env .bloom,.env .sparks,.env .flash'),function(el){
    if(el.parentNode) el.parentNode.removeChild(el);
  });
}
function grow(){
  var before={};
  Array.prototype.forEach.call(nodesEl.children,function(el){ before[nodeKey(el)]=1; });
  var wasTerminal=terminal;
  build();
  /* the tree has just arrived at an ending it had not reached before */
  if(terminal&&!wasTerminal) setTimeout(celebrate,GROW_HOLD+300);
  if(canAnimate()){
    /* only the limbs that did not exist a moment ago get grown */
    var fresh=Array.prototype.filter.call(nodesEl.children,function(el){
      return !before[nodeKey(el)];
    });
    revealFresh(fresh);
  }
  focusFrontier();
}
/* how the tree grows, in ms — tune these to taste */
var GROW_HOLD=380, GROW_STAGGER=480, GROW_SETTLE=760, RETRACT_STAGGER=55, EDGE_DRAW=340;

/* ---- drawing a limb ----------------------------------------------------
   Measured from the real curve rather than the pathLength attribute, and
   written as inline styles so nothing else can win the cascade — the dashed
   pathway edges carry their own stroke-dasharray. Clearing the inline styles
   afterwards hands each line back to its normal look, dashes included. */
function primeEdge(pth){
  if(!pth||!pth.getTotalLength) return 0;
  var L=0;
  try{ L=pth.getTotalLength(); }catch(e){ return 0; }
  if(!L||!isFinite(L)) return 0;
  pth.style.transition='none';
  pth.style.strokeDasharray=L+'px';
  pth.style.strokeDashoffset=L+'px';
  return L;
}
function drawEdge(pth,ms){
  if(!pth) return;
  void pth.getBoundingClientRect();          /* flush, so the primed offset sticks */
  pth.style.transition='stroke-dashoffset '+ms+'ms cubic-bezier(.22,.68,0,1)';
  pth.style.strokeDashoffset='0px';
}
/* the reverse of drawEdge: the line retreats back the way it came */
function undrawEdge(pth,ms){
  if(!pth||!pth.getTotalLength) return;
  var L=0;
  try{ L=pth.getTotalLength(); }catch(e){ return; }
  if(!L||!isFinite(L)) return;
  pth.style.transition='none';
  pth.style.strokeDasharray=L+'px';
  pth.style.strokeDashoffset='0px';
  void pth.getBoundingClientRect();
  pth.style.transition='stroke-dashoffset '+ms+'ms ease-in';
  pth.style.strokeDashoffset=L+'px';
}
function clearEdge(pth){
  if(!pth) return;
  pth.style.transition=''; pth.style.strokeDasharray=''; pth.style.strokeDashoffset='';
}

/* Grow one limb at a time: the line draws itself, then the node on the end of
   it fades in, then the next line starts. */
/* Every timer the grow animation has in flight. A withdrawal has to be able to
   cancel these: a limb revealed a moment ago still has a timer due to strip
   .pre off it, and that fired straight after the retraction set it — which is
   exactly how the result card ended up stranded off-screen, fully opaque. */
var revealTimers=[];
function stopReveal(){ revealTimers.forEach(clearTimeout); revealTimers=[]; }
function revealFresh(fresh){
  var k=motionScale(), draw=Math.round(EDGE_DRAW*k),
      hold=Math.round(GROW_HOLD*k), step=Math.round(GROW_STAGGER*k),
      settleMs=Math.round(GROW_SETTLE*k);
  /* hide node and line together, before the browser paints either */
  fresh.forEach(function(el){
    el.classList.add('pre','entering');
    el.__primed=primeEdge(el.__inEdge)>0;
  });
  fresh.forEach(function(el,i){
    var pth=el.__inEdge, at=hold+i*step, nodeAt=at+(el.__primed?draw:0);
    if(el.__primed) revealTimers.push(setTimeout(function(){ drawEdge(pth,draw); sndLine(); },at));
    revealTimers.push(setTimeout(function(){
      el.classList.remove('pre');
      clearEdge(pth);
      if(el.id==='resultNode') sndResult(); else sndNode(i);
    },nodeAt));
    revealTimers.push(setTimeout(function(){ el.classList.remove('entering'); },nodeAt+settleMs));
  });
  var last=hold+Math.max(0,fresh.length-1)*step+draw+settleMs;
  /* safety: never let a node or line stay hidden if the timers stall */
  revealTimers.push(setTimeout(function(){ settle(); },last+400));
}

/* the questions currently on the trunk, root first */
function chainIds(){
  var ids=[], q='q1';
  for(var i=0;i<=path.length;i++){
    ids.push(q);
    if(i<path.length){ q=NODES[path[i].node].a[path[i].ai].to; if(!NODES[q]) break; }
    else break;
  }
  return ids;
}

/* Click a question you already answered (or your own answer on it) and the
   tree pulls back to it: everything below withers away deepest-first, then the
   question reopens with all of its options live again. */
function reopen(nodeId){
  var idx=-1;
  for(var i=0;i<path.length;i++) if(path[i].node===nodeId){ idx=i; break; }
  if(idx<0) return;                       /* not answered yet — nothing to undo */
  sndRetract();
  path=path.slice(0,idx);
  collected=[];
  path.forEach(function(pp){
    var g=NODES[pp.node].a[pp.ai].grants;
    if(g&&collected.indexOf(g)<0) collected.push(g);
  });
  closeSheet();

  function rebuild(){
    build();
    var fresh=Array.prototype.filter.call(nodesEl.children,function(el){
      return el.dataset.node===nodeId&&el.classList.contains('opt');
    });
    if(canAnimate()) revealFresh(fresh);
    focusFrontier();
  }
  if(!canAnimate()){ rebuild(); return; }

  var keep={}; chainIds().forEach(function(id){ keep[id]=1; });
  var doomed=Array.prototype.filter.call(nodesEl.children,function(el){
    var id=el.dataset.node;
    if(!id) return true;                                  /* result + pathway leaves */
    if(!keep[id]) return true;                            /* questions below this one */
    return el.classList.contains('opt')&&id===nodeId;     /* its answers get rebuilt live */
  });
  doomed.reverse().forEach(function(el,i){
    el.classList.add('entering');
    setTimeout(function(){ el.classList.add('pre'); },i*RETRACT_STAGGER);
  });
  setTimeout(rebuild,doomed.length*RETRACT_STAGGER+520);
}
function settle(){
  /* The grow animation leaves a repair timer behind. One firing mid-withdrawal
     strips .pre off limbs that are already retreating, which snaps them back
     into place — that is what stranded the result card off-screen. A
     withdrawal owns the canvas until it finishes. */
  if(unwinding) return;
  Array.prototype.forEach.call(nodesEl.querySelectorAll('.tnode.pre, .tnode.entering'),function(el){
    el.classList.remove('pre'); el.classList.remove('entering');
    el.style.opacity=''; el.style.transform='';
  });
  Array.prototype.forEach.call(edgesEl.querySelectorAll('.edge'),function(pth){
    if(pth.style.strokeDashoffset) clearEdge(pth);
  });
}
document.addEventListener('visibilitychange',function(){ if(document.hidden) settle(); });

nodesEl.addEventListener('click',function(e){
  var t=e.target.closest('.tnode');
  if(!t) return;
  if(t.id==='resultNode'){ openSheet(); return; }
  if(t.classList.contains('reopenable')||t.classList.contains('chosen')){
    reopen(t.dataset.node); return;
  }
  if(t.classList.contains('opt')&&!t.classList.contains('chosen')){
    choose(t.dataset.node,parseInt(t.dataset.ai,10));
  }
});
nodesEl.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' ') return;
  var t=e.target.closest('.tnode');
  if(!t) return;
  e.preventDefault();
  if(t.id==='resultNode'){ openSheet(); return; }
  if(t.classList.contains('reopenable')||t.classList.contains('chosen')){
    reopen(t.dataset.node); return;
  }
  if(t.classList.contains('opt')&&!t.classList.contains('chosen')){
    choose(t.dataset.node,parseInt(t.dataset.ai,10));
  }
});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Escape'&&!document.getElementById('sheet').hidden){ closeSheet(); return; }
  var n=parseInt(e.key,10);
  if(!n||!started) return;
  var q=currentQuestion();
  if(!NODES[q]) return;
  var opts=nodesEl.querySelectorAll('.tnode.opt[data-node="'+q+'"]');
  if(opts[n-1]){ e.preventDefault(); opts[n-1].click(); }
});

/* ---------- pan / zoom ---------- */
function bbox(){ return window.__tree?{w:window.__tree.w,h:window.__tree.h}:{w:800,h:600}; }
function fit(){
  var r=stage.getBoundingClientRect(), b=bbox(), pad=26;
  if(!r.width||!r.height||!b.w){ view={s:.7,tx:20,ty:20}; applyView(); return; }
  var s=Math.min((r.width-pad*2)/b.w,(r.height-pad*2)/b.h,1.05);
  s=Math.max(.18,s);
  view.s=s; view.tx=(r.width-b.w*s)/2; view.ty=(r.height-b.h*s)/2;
  applyView();
}
/* Pan to keep the newest row in view. The zoom level is deliberately left
   ALONE — the tree must never resize itself as it grows. Scale only ever
   changes when the reader asks for it (+ / - / Fit, ctrl+wheel, pinch). */
function focusFrontier(){
  var r=stage.getBoundingClientRect();
  if(!r.width) return;
  var target=nodesEl.querySelector('#resultNode')||nodesEl.querySelector('.tnode.q.active')||nodesEl.lastElementChild;
  if(!target) return;
  var s=view.s;
  var cx=parseFloat(target.style.left||0)+target.offsetWidth/2;
  var cy=parseFloat(target.style.top||0);
  view.tx=r.width/2-cx*s;
  view.ty=Math.min(30,r.height*0.42-cy*s);
  applyView();
}
function zoomBy(k,cx,cy){
  var r=stage.getBoundingClientRect();
  if(cx==null){ cx=r.width/2; cy=r.height/2; }
  var ns=Math.min(2,Math.max(.15,view.s*k));
  var wx=(cx-view.tx)/view.s, wy=(cy-view.ty)/view.s;
  view.s=ns; view.tx=cx-wx*ns; view.ty=cy-wy*ns;
  applyView();
}
var drag=null;
stage.addEventListener('pointerdown',function(e){
  if(e.target.closest('.tnode')||e.target.closest('.btn')) return;
  drag={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};
  stage.classList.add('grabbing');
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove',function(e){
  if(!drag) return;
  view.tx=drag.tx+(e.clientX-drag.x); view.ty=drag.ty+(e.clientY-drag.y); applyView();
});
stage.addEventListener('pointerup',function(e){
  drag=null; stage.classList.remove('grabbing');
  try{ stage.releasePointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('wheel',function(e){
  e.preventDefault();
  /* Scrolling PANS the canvas. Only an explicit zoom gesture (ctrl/cmd+wheel,
     pinch, or the +/-/Fit buttons) is allowed to change the tree's size. */
  if(e.ctrlKey||e.metaKey){
    var r=stage.getBoundingClientRect();
    zoomBy(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);
    return;
  }
  if(e.shiftKey){ view.tx-=e.deltaY; }
  else { view.tx-=e.deltaX; view.ty-=e.deltaY; }
  applyView();
},{passive:false});
var pinch=null;
stage.addEventListener('touchstart',function(e){
  if(e.touches.length===2) pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
},{passive:true});
stage.addEventListener('touchmove',function(e){
  if(e.touches.length===2&&pinch){
    e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    var r=stage.getBoundingClientRect();
    zoomBy(d/pinch,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top);
    pinch=d;
  }
},{passive:false});
stage.addEventListener('touchend',function(){ pinch=null; },{passive:true});

document.getElementById('zIn').addEventListener('click',function(){ zoomBy(1.2); });
document.getElementById('zOut').addEventListener('click',function(){ zoomBy(1/1.2); });
document.getElementById('zFit').addEventListener('click',fit);
window.addEventListener('resize',function(){ if(started) fit(); });

function updateRail(){
  var q=currentQuestion();
  var done=path.length, rem=NODES[q]?remaining(q):0;
  railFill.style.width=Math.round((done/Math.max(done+rem,1))*100)+'%';
}
function updateHint(){
  if(terminal) hintEl.textContent='Complete — open the result, or click any greyed branch to re-route the tree.';
  else if(path.length) hintEl.textContent='Click a branch to grow the tree · click a greyed branch to re-route';
  else hintEl.textContent='Click a branch to grow the tree';
}

/* ===========================================================================
   RESULT
   ========================================================================= */
function verdict(kind){
  if(kind==='END_NONTAS') return {t:'A non-TAS pathway fits best right now',
    s:'You can protect your air and build capacity without TAS, and revisit once the boundary question is resolved.'};
  var reg=collected.indexOf('regulatory')>=0,tgt=collected.indexOf('targeted')>=0,par=collected.indexOf('participatory')>=0;
  if(reg&&par) return {t:'Regulatory + Participatory TAS',s:'You have sources to manage and reasons to influence what happens next door — seek both roles. They are not mutually exclusive.'};
  if(tgt&&par) return {t:'Targeted + Participatory TAS',s:'A focused program at home, plus a formal voice in the decisions made around you.'};
  if(reg) return {t:'Regulatory TAS',s:'Become the primary implementing authority for the air-pollution sources in your jurisdiction.'};
  if(tgt) return {t:'Targeted Regulatory TAS',s:'A focused program can address your specific local air-quality issue.'};
  if(par) return {t:'Participatory (good-neighbour) TAS',s:'Get a formal, early voice in the state and local decisions that affect your air quality.'};
  return {t:'TAS may offer limited near-term benefit',s:'With few sources and no outside concern, non-TAS programs may serve you now — but the option stays open as things change.'};
}
function boundaryPick(){
  var b=null,d=null;
  path.forEach(function(p){
    if(p.node==='q1') b=NODES.q1.a[p.ai].short;
    if(p.node==='q1b') d=NODES.q1b.a[p.ai].short;
  });
  return {b:b,d:d};
}
function chipsHtml(a){ return '<div class="chips">'+a.map(function(s){return '<span class="sx">'+esc(s)+'</span>';}).join('')+'</div>'; }
function checksHtml(a){ return '<ul class="check">'+a.map(function(c){
  return '<li><span class="cx">'+TICK+'</span><span><b>'+c.h+'</b>'+(c.d?'<span class="d">'+c.d+'</span>':'')+'</span></li>';}).join('')+'</ul>'; }
function outCard(k,kind){
  var o=OUT[k];
  var h='<div class="card '+kind+'"><div class="rk">'+esc(o.name)+'</div><h4>'+esc(o.title)+'</h4>';
  if(o.body) h+='<p class="m">'+o.body+'</p>';
  if(o.options) h+='<div class="two">'+o.options.map(function(x){return '<div class="mini"><div class="mh">'+x.h+'</div><div class="md">'+x.d+'</div></div>';}).join('')+'</div>';
  if(o.checks) h+=checksHtml(o.checks);
  if(o.sections) h+='<p class="m" style="margin:9px 0 0">Sections you may seek:</p>'+chipsHtml(o.sections);
  return h+'</div>';
}
function resultHtml(){
  var declined=terminal==='END_NONTAS', v=verdict(terminal), f=boundaryPick();
  var h='<p style="margin:0 0 4px;color:var(--muted)">'+esc(v.s)+'</p>';
  /* two short tiles give the bento its rhythm and answer the first two
     questions a reader actually has: how many sections, and how far in am I */
  var secCount=0;
  collected.forEach(function(k){ if(OUT[k].sections) secCount+=OUT[k].sections.length; });
  var realPaths=collected.filter(function(x){return x!=='capacity';}).length;
  h+='<div class="card stat tile-half"><div class="rk">CAA sections</div>'
   + '<div><div class="big">'+secCount+'</div><div class="lbl">'
   + (secCount?'to consider seeking':'none required for this route')+'</div></div></div>';
  h+='<div class="card stat tile-half"><div class="rk">Pathways</div>'
   + '<div><div class="big">'+realPaths+'</div><div class="lbl">'
   + (realPaths===1?'recommended route':(realPaths?'complementary routes':'non-TAS route'))+'</div></div></div>';
  if(f.b&&f.b.indexOf('No')!==0){
    var ex=f.d==='Undisputed only'
      ?'Applying over <b>undisputed areas only</b> is the lower-risk route you chose — be sure to affirm the excluded areas remain claimed.'
      :(f.d==='Full area'?'You chose to proceed over the <b>full claimed area</b> — have counsel prepare for a possible challenge.':'');
    h+='<div class="card danger"><div class="rk">Keep in view</div><h4>Your boundary showing carries risk</h4>'
      +'<p>Because a boundary question exists, your application will be shared with the appropriate governmental entities, who may challenge it. An adverse ruling could <b>narrow your recognized CAA regulatory jurisdiction</b> — not your land title. '+ex+'</p></div>';
  }
  var real=collected.filter(function(x){return x!=='capacity';});
  if(!declined){
    h+='<div class="sectitle">Recommended pathway'+(real.length>1?'s':'')+'</div>';
    ['regulatory','targeted','participatory'].forEach(function(k){ if(collected.indexOf(k)>=0) h+=outCard(k,'key'); });
    if(!real.length) h+='<div class="card soft"><div class="rk">Worth knowing</div><h4>You have strong options without TAS today</h4>'
      +'<p class="m">With little source activity and no outside concern right now, the non-TAS pathways below may meet your needs. TAS remains available whenever sources appear or priorities shift.</p></div>';
    if(collected.indexOf('capacity')>=0) h+=outCard('capacity','warn');
  }
  h+='<div class="card soft"><div class="rk">No TAS required</div><h4>'
    +(declined?'Your non-TAS pathway':'Also available — with or without TAS')+'</h4>'+checksHtml(NONTAS)+'</div>';
  h+='<div class="sectitle">Before you file — the four eligibility criteria</div>'
    +'<div class="card"><p class="m" style="margin-top:0">To be approved, your Tribe must be able to demonstrate all four (40 CFR §§ 49.6 / 49.7):</p>'+checksHtml(CRITERIA)+'</div>';
  h+='<div class="sectitle">Next steps</div><div class="card"><ol class="steps">'
    +NEXT.map(function(s){return '<li><b>'+s.h+'</b>'+(s.d?'<div class="d">'+s.d+'</div>':'')+'</li>';}).join('')+'</ol></div>';
  h+='<div class="card"><div class="rk">Reference</div><div class="reflinks">'
    +LINKS.map(function(l){return '<a href="'+l.u+'" target="_blank" rel="noopener">'+esc(l.t)+' ↗</a>';}).join('')+'</div></div>';
  h+='<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">'
    +'<button class="btn solid" data-print="1">Print / Save PDF</button>'
    +'<button class="btn" data-close="1">Back to the tree</button></div>';
  h+='<p class="disc">'+DISC+'</p>';
  return h;
}
var sheet=document.getElementById('sheet'), prevFocus=null;
function openSheet(){
  if(!terminal) return;
  prevFocus=document.activeElement;
  document.getElementById('sheetTitle').textContent=verdict(terminal).t;
  document.getElementById('sheetBody').innerHTML=resultHtml();
  sheet.hidden=false;
  /* the printout is of the result, so it is offered while the result is open */
  var c=sheet.querySelector('[data-close]'); if(c) c.focus({preventScroll:true});
}
function closeSheet(){
  sheet.hidden=true;
  if(prevFocus&&prevFocus.focus) try{ prevFocus.focus({preventScroll:true}); }catch(e){}
}
sheet.addEventListener('click',function(e){
  if(e.target.closest('[data-close]')) closeSheet();
  if(e.target.closest('[data-print]')) doPrint();
});
document.getElementById('btnResult').addEventListener('click',openSheet);

/* ---------- print ---------- */
/* A drawing of the route actually taken: each question, the answer chosen
   under it, and the result at the end. Plain greys and inline geometry so it
   survives a printer with no CSS variables and no colour. */
function printTree(){
  if(!path.length) return '';
  var W=680, QH=54, AH=38, GAP=20, PAD=14, x=W/2;
  var rows=[];
  path.forEach(function(st){
    var n=NODES[st.node], a=n.a[st.ai];
    rows.push({kind:'q',top:esc(n.short||n.tag||''),main:esc(n.q||'')});
    rows.push({kind:'a',top:'',main:esc(a.label||''),grants:a.grants?esc((OUT[a.grants]||{}).name||''):''});
  });
  var v=verdict(terminal);
  rows.push({kind:'r',top:'Result',main:esc(v.t)});

  var y=PAD, parts=[];
  rows.forEach(function(r,i){
    var h=(r.kind==='q')?QH:(r.kind==='r'?QH:AH);
    var w=(r.kind==='a')?360:520;
    var lx=x-w/2;
    var stroke=(r.kind==='a')?'#4a4a4a':'#111';
    var dash=(r.kind==='a')?'':'';
    var fill=(r.kind==='r')?'#f0f0f0':'#fff';
    if(i>0) parts.push('<line x1="'+x+'" y1="'+(y-GAP)+'" x2="'+x+'" y2="'+y+'" stroke="#777" stroke-width="1.2"/>');
    parts.push('<rect x="'+lx+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="7" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(r.kind==='a'?1:1.5)+'"'+dash+'/>');
    var ty=y+(r.top?17:h/2+4);
    if(r.top) parts.push('<text x="'+(lx+12)+'" y="'+(y+15)+'" font-size="8.5" letter-spacing="1.1" fill="#666" font-family="sans-serif">'+r.top.toUpperCase()+'</text>');
    var main=r.main.length>68?r.main.slice(0,66)+'…':r.main;
    parts.push('<text x="'+(lx+12)+'" y="'+(r.top?y+34:y+h/2+4)+'" font-size="'+(r.kind==='a'?11:12.5)+'" font-family="Georgia,serif" fill="#111">'+main+'</text>');
    if(r.grants) parts.push('<text x="'+(lx+w-12)+'" y="'+(y+h/2+4)+'" text-anchor="end" font-size="8.5" font-family="sans-serif" fill="#3a5a3a">+ '+r.grants+'</text>');
    y+=h+GAP;
  });
  var H=y-GAP+PAD;
  return '<h3>The route taken</h3><svg class="ptree" viewBox="0 0 '+W+' '+H+'" width="100%" '
    +'preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">'+parts.join('')+'</svg>';
}
function doPrint(){
  var v=terminal?verdict(terminal):{t:'TAS decision — in progress',s:'This path is not yet complete.'};
  var h='<h2>'+esc(v.t)+'</h2><p>'+esc(v.s)+'</p>';
  h+=printTree();
  h+='<h3>Answers chosen</h3><div>';
  path.forEach(function(p){
    var n=NODES[p.node],a=n.a[p.ai];
    h+='<span class="pc">'+esc(n.short+': '+(a.short||a.label))+'</span>';
  });
  h+='</div>';
  if(collected.length){
    h+='<h3>Recommended pathways</h3>';
    collected.forEach(function(k){
      var o=OUT[k];
      h+='<p><b>'+esc(o.name)+' — '+esc(o.title)+'</b></p>';
      if(o.options) h+='<ul>'+o.options.map(function(x){return '<li><b>'+x.h+'</b> — '+x.d+'</li>';}).join('')+'</ul>';
      if(o.checks) h+='<ul>'+o.checks.map(function(x){return '<li><b>'+x.h+'</b> — '+x.d+'</li>';}).join('')+'</ul>';
      if(o.sections) h+='<div>'+o.sections.map(function(s){return '<span class="psx">'+esc(s)+'</span>';}).join('')+'</div>';
    });
  }
  h+='<h3>Non-TAS options</h3><ul>'+NONTAS.map(function(x){return '<li><b>'+x.h+'</b> — '+x.d+'</li>';}).join('')+'</ul>';
  h+='<h3>The four eligibility criteria (40 CFR §§ 49.6 / 49.7)</h3><ul>'+CRITERIA.map(function(c){return '<li><b>'+c.h+'</b> — '+c.d+'</li>';}).join('')+'</ul>';
  h+='<h3>Next steps</h3><ul>'+NEXT.map(function(s){return '<li><b>'+s.h+'</b>'+(s.d?' '+s.d:'')+'</li>';}).join('')+'</ul>';
  h+='<h3>Reference</h3><ul>'+LINKS.map(function(l){return '<li>'+esc(l.t)+' — '+l.u+'</li>';}).join('')+'</ul>';
  h+='<p class="pd">'+DISC+'</p>';
  document.getElementById('printOut').innerHTML=h;
  window.print();
}

/* ---------- start / reset ---------- */
function start(){
  if(started) return;
  started=true;
  document.body.classList.add('running');
  build();
  view.s=1; focusFrontier();
}
/* Start over drops straight back to question 1 — there is no gate to return
   to, so `started` stays true and the canvas is just rebuilt empty. */
/* Start over withdraws the tree instead of blinking it away: the deepest limb
   goes first and the retreat runs back up to the root, each line retracting
   the way it was drawn with a note to match. */
var unwindTimers=[], unwinding=false;
function stopUnwind(){ unwindTimers.forEach(clearTimeout); unwindTimers=[]; unwinding=false; }
function freshTree(){
  unwinding=false;
  path=[]; collected=[]; terminal=null;
  clearCelebration();
  nodesEl.innerHTML=''; edgesEl.innerHTML='';
  railFill.style.width='0%';
  document.getElementById('btnResult').hidden=true;
  closeSheet();
  build();
  view.s=1; focusFrontier();
}
function reset(){
  stopUnwind();
  stopReveal();
  closeSheet();
  clearCelebration();
  var kids=Array.prototype.slice.call(nodesEl.children);
  if(!canAnimate()||kids.length<2){ freshTree(); return; }
  unwinding=true;
  /* deepest first, so the tail leaves before the trunk */
  kids.sort(function(a,b){ return parseFloat(b.style.top||0)-parseFloat(a.style.top||0); });
  /* the whole withdrawal is held to about a second and a half however big the
     tree got, so starting over never feels like waiting */
  var step=Math.max(28,Math.min(85,Math.round(1500/kids.length)));
  /* where the view starts, and where it should be looking when the last limb
     goes: the root, comfortably in frame */
  var sr=stage.getBoundingClientRect();
  var rootTop=Math.min.apply(null,kids.map(function(k){ return parseFloat(k.style.top||0); }));
  var unwindFrom=view.ty, unwindTo=sr.height*0.34-rootTop*view.s;
  kids.forEach(function(el,i){
    unwindTimers.push(setTimeout(function(){
      if(el.__inEdge) undrawEdge(el.__inEdge,step*2.4);
      el.classList.add('entering','pre');
      /* every other limb, or a big tree turns into a machine gun */
      if(i%2===0) sndUnwind(i);
      /* ride the retreat back up. Chasing the lowest node still standing made
         the view lurch, because several limbs leave between frames near the
         end; easing from where the reader was to where the root sits keeps it
         continuous and finishes looking at the trunk. */
      var k2=(i+1)/kids.length;
      var e=1-Math.pow(1-k2,2);
      view.ty=unwindFrom+(unwindTo-unwindFrom)*e;
      applyView();
    },i*step));
  });
  unwindTimers.push(setTimeout(freshTree,kids.length*step+380));
}
document.getElementById('btnReset').addEventListener('click',reset);
/* a choice made mid-withdrawal cancels it rather than fighting it */
nodesEl.addEventListener('pointerdown',stopUnwind,true);
document.getElementById('btnSound').addEventListener('click',function(){
  setSound(!AUDIO.on);
  if(AUDIO.on) sndNode(2);              /* let the reader hear what they turned on */
});
setSound(AUDIO.on);

/* ===========================================================================
   DEPTH INTERACTIONS
   Parallax on the ridge layers, and a slight tilt of interactive nodes toward
   the pointer. Both are pure transform writes on rAF-free paths so they stay
   cheap, and both are inert when the reader prefers reduced motion.
   ========================================================================= */
var ridgeEl=document.querySelector('.env .ridges');
var ridgePaths=ridgeEl?ridgeEl.querySelectorAll('path'):[];
/* far ridges shift least — the standard parallax reading of distance */
var PARALLAX=[0.018,0.038,0.066];
function paintParallax(){
  if(reduce||!ridgePaths.length) return;
  for(var i=0;i<ridgePaths.length;i++){
    var k=PARALLAX[i]||0.03;
    ridgePaths[i].setAttribute('transform','translate('+(view.tx*k).toFixed(2)+','+(view.ty*k*0.35).toFixed(2)+')');
  }
}
var _applyView=applyView;
applyView=function(){ _applyView(); paintParallax(); };

/* Deliberately NO pointer tilt on the cards. Rotating a node rotates the
   label the reader is in the middle of reading, and this audience cannot be
   handed soft type. Depth here comes from the receding not-taken plane and
   from backdrop parallax — neither of which touches text the reader needs. */

/* The tree runs the moment the page loads. This script is the last thing in
   the document, so the stage is already laid out and focusFrontier() can
   measure it synchronously — deliberately NOT via requestAnimationFrame,
   which never fires in a background tab and would leave the page blank
   until the reader switched to it. */
start();
/* If the first measurement landed before the browser had sized the stage
   (webfont swap, restored window), re-centre once everything settles. */
window.addEventListener('load',function(){ if(started) focusFrontier(); });
</script>
