<meta charset="utf-8">
<title>My work — TAS Decision Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the palette and the backdrop, shared with the other pages -->
<link rel="stylesheet" href="theme.css">
<style>

/* The work page shows the backdrop behind a column of text rather than behind
   a canvas, so its ridges are held back to half strength and kept shorter.
   Everything else about it comes from theme.css. */
.env .ridges{height:min(46vh,420px);min-height:0;opacity:.5}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea,.btn,.kk,.meta{font-family:var(--sans)}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-ink)}

 .env .ridges .r2{fill:var(--ridge-2)} .env .ridges .r1{fill:var(--ridge-1)}

.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;flex:none;display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,2.5vw,20px);background:var(--surface);border-bottom:1px solid var(--border);
  box-shadow:var(--sh1);z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand .mk{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent)}
.brand .mk svg{width:17px;height:17px}
.brand .kk{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  display:block;line-height:1.3;white-space:nowrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:19px;margin:0;line-height:1.15;
  text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:7px;flex:none;align-items:center}
@media (max-width:780px){ .brand .kk{display:none} .brand h1{font-size:15px} .acts .hideSm{display:none} }

.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:9px;
  padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  text-decoration:none;transition:border-color .18s,color .18s,transform .12s,box-shadow .18s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px);box-shadow:var(--sh1)}
.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px;border-color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.solid:hover{color:var(--on-accent);filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{border-color:var(--alert);color:var(--alert)}
.btn.danger:hover{background:var(--alert-bg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}

.wrap{flex:1;width:min(1000px,100%);margin:0 auto;padding:22px clamp(12px,3vw,24px) 60px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:0 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;font-family:var(--sans);
  font-size:13px;font-weight:600;letter-spacing:var(--track);color:var(--muted);padding:10px 12px;
  white-space:nowrap;border-radius:8px 8px 0 0}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);background:var(--surface-2)}
.tabs button:hover{color:var(--accent-ink)}
.tabs .n{font-size:11px;color:var(--faint);margin-left:5px}

.head{display:flex;align-items:flex-end;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.head h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1;
  text-transform:uppercase;letter-spacing:.02em}
.head p{margin:3px 0 0;font-size:13.5px;color:var(--muted);max-width:62ch}
.head .grow{flex:1}

.list{display:grid;gap:10px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;
  box-shadow:var(--sh1);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.row .main{flex:1;min-width:220px}
.row h3{font-family:var(--serif);font-weight:600;font-size:16.5px;margin:0 0 3px;line-height:1.25}
.row .meta{font-size:11.5px;color:var(--faint);letter-spacing:.02em}
.row .note{font-size:13px;color:var(--muted);margin:6px 0 0}
.row .acts2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .chips{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 0}
.sx{font-family:var(--sans);font-weight:600;font-size:11px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:6px;padding:2px 7px}
.sx.warn{background:var(--risk-bg);color:var(--risk)}

.empty{border:1px dashed var(--border-strong);border-radius:13px;padding:26px 22px;text-align:center;
  color:var(--muted);background:var(--surface-2)}
.empty h3{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink);margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:56ch;font-size:14px}

.gate{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh2);
  padding:26px clamp(18px,4vw,32px);max-width:660px;margin:30px auto}
.gate .kk{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);display:block}
.gate h2{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 10px;line-height:1.08;
  text-transform:uppercase;letter-spacing:.02em}
.gate p{font-size:15px;color:var(--muted);margin:0 0 12px}
.gate ul{margin:0 0 16px;padding-left:20px;color:var(--muted);font-size:14.5px}
.gate li{margin:0 0 5px}
.gate .row2{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}

/* ---- document editor -------------------------------------------------- */
.ed{display:none}
.ed.on{display:block}
.ed .edbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.ed .edbar .grow{flex:1}
.ed .status{font-family:var(--sans);font-size:11.5px;color:var(--faint);white-space:nowrap}
.ed .status.saving{color:var(--risk)} .ed .status.saved{color:var(--good)} .ed .status.failed{color:var(--alert)}
.ed input.title{width:100%;font-family:var(--display);font-weight:400;font-size:27px;line-height:1.1;
  text-transform:uppercase;letter-spacing:.02em;background:transparent;color:var(--ink);
  border:0;border-bottom:1px solid transparent;padding:4px 0;margin:0 0 4px}
.ed input.title:hover{border-bottom-color:var(--border)}
.ed input.title:focus{outline:0;border-bottom-color:var(--accent)}
.ed .tools{display:flex;gap:4px;flex-wrap:wrap;padding:7px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px 10px 0 0;border-bottom:0;position:sticky;top:52px;z-index:10}
.ed .tools button{border:1px solid transparent;background:none;color:var(--ink);border-radius:7px;
  padding:5px 9px;font-size:12.5px;font-weight:600;font-family:var(--sans);min-width:30px}
.ed .tools button:hover{border-color:var(--border-strong);background:var(--surface)}
.ed .tools .sep{width:1px;background:var(--border);margin:2px 4px}
.ed .paper{background:var(--surface);border:1px solid var(--border);border-radius:0 0 13px 13px;
  box-shadow:var(--sh1);padding:clamp(18px,4vw,36px);min-height:52vh}
.ed .paper:focus{outline:0;box-shadow:var(--sh2)}
.ed .paper h2{font-family:var(--display);font-weight:400;font-size:23px;text-transform:uppercase;
  letter-spacing:.02em;margin:22px 0 8px;color:var(--ink)}
.ed .paper h3{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:var(--track);
  text-transform:uppercase;color:var(--accent);margin:20px 0 6px}
.ed .paper p{margin:0 0 10px}
.ed .paper ul,.ed .paper ol{margin:0 0 12px;padding-left:22px}
.ed .paper li{margin:0 0 5px}
.ed .paper blockquote{margin:0 0 12px;padding:2px 0 2px 14px;border-left:3px solid var(--accent-soft);color:var(--muted)}
.ed .paper code{font-family:var(--sans);font-weight:600;font-size:13px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:5px;padding:1px 5px}
.ed .paper .pc,.ed .paper .psx{display:inline-block;font-family:var(--sans);font-size:12px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;margin:0 5px 5px 0}
.ed .paper table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:14px}
.ed .paper td,.ed .paper th{border:1px solid var(--border);padding:6px 9px;text-align:left}
.ed .paper svg{max-width:100%;height:auto}
.ed .paper hr{border:0;border-top:1px solid var(--border);margin:18px 0}
.ed .fnote{font-size:12px;color:var(--faint);margin:12px 2px 0;line-height:1.5}

@media print{
  .env,.bar,.tabs,.head,.ed .edbar,.ed .tools,.ed .fnote{display:none!important}
  body{background:#fff;color:#111}
  .wrap{width:auto;padding:0}
  .ed .paper{border:0;box-shadow:none;padding:0;background:#fff;color:#111}
  .ed input.title{color:#111;font-size:24px}
}
</style>

    <path class="r1" d="M0,353 L148,318 L282,349 L440,306 L596,345 L742,316 L910,353 L1076,320 L1244,351 L1380,328 L1440,345 L1440,420 L0,420 Z"/>

      <span class="mk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V13M12 13L6 7M12 13l6-6M12 13V4M4 7h4M16 7h4"/></svg></span>

<script src="account.js"></script>
<script>
"use strict";
/* ===========================================================================
   MY WORK
   Three lists and a document editor. Everything here goes through TAS.store,
   which goes through /api, which is the only place any of it is kept — there
   is no local copy of a saved record, so what this page shows is what the
   account holds.
   ========================================================================= */
/* This page is the account, so it cannot do anything useful without
   account.js. If that file did not load, say so in words rather than throwing
   a reference error into an empty page. */
if(!window.TAS){
  document.getElementById('gate').hidden=false;
  document.getElementById('gate').innerHTML=
    '<div class="gate"><span class="kk">Something is missing</span>'
    +'<h2>This page could not load</h2>'
    +'<p><code>account.js</code> did not load, and this page is nothing without it. '
    +'Reload, and if it happens again the file is missing from the deployment.</p>'
    +'<div class="row2"><a class="btn solid" href="/">Open the tree</a>'
    +'<a class="btn" href="/admin">Open the editor</a></div></div>';
  throw new Error('account.js did not load');
}
var ui=TAS.ui, store=TAS.store, esc=ui.esc, el=ui.el;

/* Whether to offer a way into the editor at all. With ADMIN_EMAIL set, the
   editor belongs to one account; for everyone else a link to it leads to a
   page that says so and nothing more, which is a worse answer than no link.
   With no ADMIN_EMAIL configured this is true for anyone signed in, and the
   page behaves as it did before the gate existed. */
function canEdit(){ return TAS.auth.isAdmin(); }
function showEditorLinks(){
  var nav=document.getElementById('navEditor');
  if(nav) nav.hidden=!canEdit();
}
var KINDS=[
  {key:'runs',   label:'Saved paths', title:'Saved paths',
   blurb:'A path is what you answered in the tree. Open one and the tree grows back to exactly where you left it — including the answers you did not take.'},
  {key:'documents',label:'Documents', title:'Documents',
   blurb:'A document starts as the result the tree produced and becomes whatever you make of it. Edit it here, print it, and it stays on your account.'},
  {key:'trees',  label:'Trees',       title:'Saved trees',
   blurb:'A tree is the content itself — the questions, the options, the pathways and the result copy.'},
  {key:'trash',  label:'Deleted',     title:'Deleted',
   blurb:'Nothing is thrown away when you delete it. It waits here until you restore it or delete it for good.'}
];
var current='runs';
var cache={};

/* ---------- shell ---------- */
function fmtDate(iso){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d)) return '';
  var now=new Date(), ms=now-d;
  if(ms<60000) return 'just now';
  if(ms<3600000) return Math.round(ms/60000)+' min ago';
  if(ms<86400000) return Math.round(ms/3600000)+' h ago';
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear();
}
function counts(){ return (TAS.auth.state.counts)||{}; }

function paintTabs(){
  var t=document.getElementById('tabs'); t.innerHTML='';
  var c=counts();
  var n={runs:c.runs||0,documents:c.documents||0,trees:c.trees||0,
         trash:(c.trashedRuns||0)+(c.trashedDocuments||0)+(c.trashedTrees||0)};
  KINDS.forEach(function(k){
    t.appendChild(el('button',{type:'button',role:'tab','aria-selected':String(k.key===current),
      onclick:function(){ go(k.key); }},[
      document.createTextNode(k.label),
      el('span',{class:'n',text:String(n[k.key]||0)})
    ]));
  });
}

function go(key){
  current=key;
  if(location.hash!=='#'+key) history.replaceState(null,'','#'+key);
  paintTabs();
  render();
}

function render(){
  document.getElementById('ed').classList.remove('on');
  document.getElementById('app').hidden=false;
  var k=KINDS.filter(function(x){return x.key===current;})[0];
  var panel=document.getElementById('panel');
  panel.innerHTML='';
  /* the Trees blurb ends differently depending on whether the reader has an
     editor to open one in */
  var blurb=k.blurb+(k.key!=='trees'?'':(canEdit()
    ? ' Open one in the editor to change it, or preview it in the tree.'
    : ' Preview one to read it back in the tree.'));
  panel.appendChild(el('div',{class:'head'},[
    el('div',{},[el('h2',{text:k.title}),el('p',{text:blurb})]),
    el('span',{class:'grow'}),
    current==='runs'?el('a',{class:'btn solid',href:'/',text:'Open the tree'}):
    (current==='trees'&&canEdit())?el('a',{class:'btn solid',href:'/admin',text:'Open the editor'}):null
  ]));
  var list=el('div',{class:'list',text:'Loading…'});
  panel.appendChild(list);
  if(current==='trash') return loadTrash(list);
  store.list(current).then(function(d){
    cache[current]=d.items;
    drawList(list,current,d.items,false);
  },function(err){ list.innerHTML=''; list.appendChild(ui.message(esc(err.message),'bad')); ui.report(err); });
}

function loadTrash(list){
  Promise.all(['runs','documents','trees'].map(function(k){
    return store.list(k,{trash:true}).then(function(d){
      return d.items.map(function(it){ it.__kind=k; return it; });
    },function(){ return []; });
  })).then(function(all){
    var items=all[0].concat(all[1],all[2]).sort(function(a,b){
      return new Date(b.deletedAt||b.updatedAt)-new Date(a.deletedAt||a.updatedAt);
    });
    drawList(list,'trash',items,true);
  });
}

function drawList(list,kind,items,isTrash){
  list.innerHTML='';
  if(!items.length){ list.appendChild(emptyFor(kind)); return; }
  items.forEach(function(it){ list.appendChild(rowFor(it.__kind||kind,it,isTrash)); });
}

function emptyFor(kind){
  var copy={
    runs:['Nothing saved yet','Answer the questions in the tree and press <b>Save path</b> in the top bar. It will be here when you come back.','Open the tree','/'],
    documents:['No documents yet','Reach a result in the tree, then use <b>Save as document</b>. You can edit every word of it here afterwards.','Open the tree','/'],
    trees:canEdit()
      ? ['No saved trees','The editor keeps a working copy in this browser. <b>Save to my account</b> in the editor puts a copy here, where it survives this machine.','Open the editor','/admin']
      : ['No saved trees','A tree is the content itself \u2014 the questions and what they recommend. Editing it is limited to one account on this deployment, so nothing lands here unless that is you.','Open the tree','/'],
    trash:['Nothing deleted','Anything you delete waits here rather than going straight out.','Back to your work','#runs']
  }[kind];
  return el('div',{class:'empty'},[
    el('h3',{text:copy[0]}),
    el('p',{html:copy[1]}),
    el('a',{class:'btn solid',href:copy[3],text:copy[2]})
  ]);
}

function rowFor(kind,it,isTrash){
  var meta=[];
  if(kind==='runs'){
    meta.push((it.steps||0)+' answer'+((it.steps||0)===1?'':'s'));
    if(it.terminal) meta.push(it.terminal==='END_NONTAS'?'non-TAS route':'reached a result');
  }
  if(kind==='documents'){
    meta.push(it.edited?'edited by you':'as generated');
    if(it.size) meta.push(Math.max(1,Math.round(it.size/1000))+' KB');
  }
  if(kind==='trees'&&it.size) meta.push(Math.max(1,Math.round(it.size/1000))+' KB');
  meta.push('updated '+fmtDate(it.updatedAt));
  if(isTrash&&it.deletedAt) meta.push('deleted '+fmtDate(it.deletedAt));

  var acts=el('div',{class:'acts2'});
  if(isTrash){
    acts.appendChild(el('button',{class:'btn sm',type:'button',text:'Restore',onclick:function(){
      store.restore(kind,it.id).then(function(){ ui.toast('Restored.','good'); render(); },ui.report);
    }}));
    acts.appendChild(el('button',{class:'btn sm danger',type:'button',text:'Delete for good',onclick:function(){
      ui.confirm({title:'Delete for good?',danger:true,confirmLabel:'Delete for good',kind:'bad',
        html:'<b>'+esc(it.title)+'</b> will be removed from the database. This cannot be undone and there is no backup.'
      }).then(function(yes){
        if(!yes) return;
        store.purge(kind,it.id).then(function(){ ui.toast('Deleted for good.',null); render(); },ui.report);
      });
    }}));
  }else{
    if(kind==='runs'){
      acts.appendChild(el('a',{class:'btn sm solid',href:'/?run='+encodeURIComponent(it.id),text:'Open in the tree'}));
      acts.appendChild(el('a',{class:'btn sm',href:'/?run='+encodeURIComponent(it.id)+'&document=1',text:'Make a document'}));
    }
    if(kind==='documents'){
      acts.appendChild(el('button',{class:'btn sm solid',type:'button',text:'Open',onclick:function(){ openDoc(it.id); }}));
    }
    if(kind==='trees'){
      /* Preview needs no editor and stays for everyone: a saved tree is this
         account's own content, and reading it back is not editing. */
      if(canEdit()) acts.appendChild(el('a',{class:'btn sm solid',href:'/admin?tree='+encodeURIComponent(it.id),text:'Open in the editor'}));
      acts.appendChild(el('a',{class:(canEdit()?'btn sm':'btn sm solid'),href:'/?tree='+encodeURIComponent(it.id),text:'Preview'}));
    }
    acts.appendChild(el('button',{class:'btn sm',type:'button',text:'Rename',onclick:function(){ rename(kind,it); }}));
    acts.appendChild(el('button',{class:'btn sm danger',type:'button',text:'Delete',onclick:function(){
      store.remove(kind,it.id).then(function(){
        render();
        ui.toast('Moved to Deleted.',null,{action:'Undo',onAction:function(){
          store.restore(kind,it.id).then(function(){ render(); });
        }});
      },ui.report);
    }}));
  }

  var main=el('div',{class:'main'},[
    el('h3',{text:it.title||'Untitled'}),
    el('div',{class:'meta',text:meta.join(' · ')}),
    it.note?el('p',{class:'note',text:it.note}):null
  ]);
  if(kind==='runs'&&it.collected&&it.collected.length){
    var chips=el('div',{class:'chips'});
    it.collected.forEach(function(c){ chips.appendChild(el('span',{class:'sx',text:c})); });
    main.appendChild(chips);
  }
  if(isTrash) main.insertBefore(el('span',{class:'sx warn',text:kind==='runs'?'path':kind==='trees'?'tree':'document'}),main.firstChild);
  return el('div',{class:'row'},[main,acts]);
}

function rename(kind,it){
  var m=ui.modal({title:'Rename',kicker:kind==='runs'?'Saved path':kind==='trees'?'Tree':'Document'});
  var f=ui.field({id:'wk-rename',label:'Title',value:it.title||'',maxlength:200});
  var note=ui.field({id:'wk-note',label:'Note (optional)',value:it.note||'',maxlength:300,
    hint:'A line for your future self: what this was for, who asked, what is still open.'});
  m.body.appendChild(f.wrap);
  if(kind!=='documents') m.body.appendChild(note.wrap);
  m.foot.appendChild(el('button',{class:'tasa-b',type:'button',text:'Cancel',onclick:function(){ m.close(false); }}));
  m.foot.appendChild(el('span',{class:'grow'}));
  m.foot.appendChild(el('button',{class:'tasa-b solid',type:'button',text:'Save',onclick:function(e){
    var b=e.currentTarget; b.disabled=true;
    var patch={title:f.value()};
    if(kind!=='documents') patch.note=note.value();
    store.update(kind,it.id,patch).then(function(){ m.close(true); render(); ui.toast('Renamed.','good'); },
      function(err){ b.disabled=false; f.setError(err.message); });
  }}));
  setTimeout(function(){ f.input.focus(); f.input.select(); },30);
}

/* ---------- the document editor ---------- */
var doc=null, dirty=false, saveTimer=null;
var TOOLS=[
  {cmd:'bold',label:'B',title:'Bold (ctrl+B)',style:'font-weight:800'},
  {cmd:'italic',label:'I',title:'Italic (ctrl+I)',style:'font-style:italic'},
  {cmd:'underline',label:'U',title:'Underline',style:'text-decoration:underline'},
  {sep:1},
  {block:'H2',label:'Heading',title:'A section heading'},
  {block:'H3',label:'Sub',title:'A smaller label'},
  {block:'P',label:'Text',title:'Ordinary paragraph'},
  {sep:1},
  {cmd:'insertUnorderedList',label:'• List',title:'Bulleted list'},
  {cmd:'insertOrderedList',label:'1. List',title:'Numbered list'},
  {block:'BLOCKQUOTE',label:'Quote',title:'Set apart as a quotation'},
  {sep:1},
  {cmd:'removeFormat',label:'Clear',title:'Strip formatting from the selection'},
  {rule:1,label:'Rule',title:'A horizontal rule'},
  {sep:1},
  {cmd:'undo',label:'Undo',title:'Undo (ctrl+Z)'},
  {cmd:'redo',label:'Redo',title:'Redo (ctrl+shift+Z)'}
];
function buildTools(){
  var t=document.getElementById('edTools'); t.innerHTML='';
  TOOLS.forEach(function(x){
    if(x.sep){ t.appendChild(el('div',{class:'sep'})); return; }
    t.appendChild(el('button',{type:'button',title:x.title,style:x.style||'',text:x.label,
      onmousedown:function(e){ e.preventDefault(); },
      onclick:function(){
        var body=document.getElementById('edBody');
        body.focus();
        if(x.rule) document.execCommand('insertHorizontalRule');
        else if(x.block) document.execCommand('formatBlock',false,x.block);
        else document.execCommand(x.cmd);
        touch();
      }}));
  });
}
function setStatus(s,txt){
  var e=document.getElementById('edStatus');
  e.className='status '+(s||'');
  e.textContent=txt||'';
}
function touch(){
  dirty=true;
  setStatus('saving','Saving…');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveDoc,1400);
}
function saveDoc(quiet){
  if(!doc) return Promise.resolve();
  clearTimeout(saveTimer);
  var body=document.getElementById('edBody').innerHTML;
  var title=document.getElementById('edTitle').value;
  return store.update('documents',doc.id,{title:title,bodyHtml:body,edited:true}).then(function(item){
    dirty=false; doc.title=item.title; doc.updatedAt=item.updatedAt;
    setStatus('saved','Saved '+fmtDate(item.updatedAt));
    if(!quiet&&cache.documents) cache.documents=null;
  },function(err){
    setStatus('failed','Not saved — '+(err.message||'try again'));
    ui.report(err,'save this document');
    throw err;
  });
}
function openDoc(id){
  document.getElementById('app').hidden=true;
  var ed=document.getElementById('ed');
  ed.classList.add('on');
  setStatus('','Loading…');
  document.getElementById('edBody').innerHTML='';
  document.getElementById('edTitle').value='';
  store.get('documents',id).then(function(item){
    doc=item;
    document.getElementById('edTitle').value=item.title||'';
    document.getElementById('edBody').innerHTML=item.bodyHtml||'';
    var m=item.meta||{};
    document.getElementById('edFoot').innerHTML=
      'Created '+esc(fmtDate(item.createdAt))+
      (m.generatedFrom?' from '+esc(m.generatedFrom):'')+
      '. Edits save themselves; <b>Save</b> forces it now. '+
      'Printing uses your browser’s print dialog, so <i>Save as PDF</i> is there too.';
    setStatus('saved','Saved '+fmtDate(item.updatedAt));
    if(location.hash!=='#doc/'+id) history.replaceState(null,'','#doc/'+id);
    document.getElementById('edBody').focus();
  },function(err){
    setStatus('failed',err.message);
    ui.report(err);
    go('documents');
  });
}
function closeDoc(){
  var leave=function(){ doc=null; go('documents'); };
  if(dirty){ saveDoc(true).then(leave,leave); } else leave();
}

/* Paste as text, not as whatever the source page was wearing. A pasted block
   of another site's HTML is the fastest way to make a document unprintable. */
document.getElementById('edBody').addEventListener('paste',function(e){
  if(!e.clipboardData) return;
  e.preventDefault();
  var text=e.clipboardData.getData('text/plain')||'';
  document.execCommand('insertText',false,text);
});
document.getElementById('edBody').addEventListener('input',touch);
document.getElementById('edTitle').addEventListener('input',touch);
document.getElementById('edBack').addEventListener('click',closeDoc);
document.getElementById('edSave').addEventListener('click',function(){
  saveDoc().then(function(){ ui.toast('Document saved.','good'); },function(){});
});
document.getElementById('edPrint').addEventListener('click',function(){
  saveDoc(true).then(function(){ window.print(); },function(){ window.print(); });
});
document.getElementById('edDup').addEventListener('click',function(){
  if(!doc) return;
  store.create('documents',{
    title:(doc.title||'Untitled document')+' (copy)',
    kind:doc.kind,bodyHtml:document.getElementById('edBody').innerHTML,
    runId:doc.runId,meta:doc.meta||{},edited:true
  }).then(function(item){ ui.toast('Copied.','good'); openDoc(item.id); },ui.report);
});
document.getElementById('edDel').addEventListener('click',function(){
  if(!doc) return;
  var id=doc.id, title=doc.title;
  store.remove('documents',id).then(function(){
    dirty=false; doc=null; go('documents');
    ui.toast('“'+title+'” moved to Deleted.',null,{action:'Undo',onAction:function(){
      store.restore('documents',id).then(function(){ render(); });
    }});
  },ui.report);
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&doc&&document.getElementById('ed').classList.contains('on')){
    e.preventDefault();
    saveDoc().then(function(){ ui.toast('Document saved.','good'); },function(){});
  }
});
window.addEventListener('beforeunload',function(e){
  if(dirty){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- the gate for guests ---------- */
function paintGate(){
  var g=document.getElementById('gate');
  var s=TAS.auth.state;
  document.getElementById('app').hidden=true;
  document.getElementById('ed').classList.remove('on');
  g.hidden=false;
  g.innerHTML='';
  var card=el('div',{class:'gate'});
  if(s.storage!=='ready'){
    card.appendChild(el('span',{class:'kk',text:'Guest use only'}));
    card.appendChild(el('h2',{text:'There is nowhere to keep work here'}));
    card.appendChild(el('p',{html:s.storage==='unconfigured'
      ? 'This deployment has no database behind it, so it has no accounts and nothing can be saved on the server. Everything else works.'
      : 'The database did not answer, so saved work cannot be read right now. Everything else works.'}));
    card.appendChild(el('p',{html:TAS.auth.guestCopy}));
    card.appendChild(el('div',{class:'row2'},[
      el('a',{class:'btn solid',href:'/',text:'Open the tree'}),
      /* with no storage there are no accounts, so the editor is not gated
         either and this link goes somewhere that works */
      el('a',{class:'btn',href:'/admin',text:'Open the editor'})
    ]));
  }else{
    card.appendChild(el('span',{class:'kk',text:'You are a guest'}));
    card.appendChild(el('h2',{text:'Sign in to keep your work'}));
    card.appendChild(el('p',{text:'An account holds three things, and nothing else:'}));
    card.appendChild(el('ul',{},[
      el('li',{html:'<b>Saved paths</b> — the answers you gave the tree, so you can return to a decision mid-way and carry on.'}),
      el('li',{html:'<b>Documents</b> — the result the tree produced, editable, printable, and still there next month.'}),
      el('li',{html:'<b>Trees</b> — your own version of the questions and recommendations, kept off this one machine.'})
    ]));
    card.appendChild(el('p',{html:TAS.auth.guestCopy}));
    card.appendChild(el('div',{class:'row2'},[
      el('button',{class:'btn solid',type:'button',text:'Sign in',onclick:function(){ TAS.auth.dialog({mode:'login'}); }}),
      el('button',{class:'btn',type:'button',text:'Create an account',onclick:function(){ TAS.auth.dialog({mode:'register'}); }}),
      el('a',{class:'btn',href:'/',text:'Carry on as a guest'})
    ]));
  }
  g.appendChild(card);
}

/* ---------- boot ---------- */
function boot(){
  var s=TAS.auth.state;
  showEditorLinks();
  if(!s.user){ paintGate(); return; }
  document.getElementById('gate').hidden=true;
  buildTools();
  paintTabs();
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('doc/')===0){ current='documents'; paintTabs(); openDoc(h.slice(4)); return; }
  go(['runs','documents','trees','trash'].indexOf(h)>=0?h:'runs');
}
TAS.auth.ready().then(boot);
TAS.auth.on('change',function(){
  showEditorLinks();
  if(!TAS.auth.state.user){ paintGate(); }
  else if(document.getElementById('gate').hidden===false){ boot(); }
  else paintTabs();
});
window.addEventListener('hashchange',function(){
  if(!TAS.auth.state.user) return;
  var h=location.hash.replace(/^#/,'');
  if(h.indexOf('doc/')===0){ if(!doc||doc.id!==h.slice(4)) openDoc(h.slice(4)); return; }
  if(['runs','documents','trees','trash'].indexOf(h)>=0&&h!==current) go(h);
});
</script>
