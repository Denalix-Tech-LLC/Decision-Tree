<meta charset="utf-8">
<title>TAS Tree Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- the palette and the backdrop, shared with the other pages -->
<link rel="stylesheet" href="theme.css">
<style>
/* ---------------------------------------------------------------------------
   THE GATE
   Sits over the editor rather than beside it: half an editor behind a notice
   invites someone to try the half they can see.
   ------------------------------------------------------------------------- */
.gate{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;
  padding:clamp(12px,4vw,32px);background:rgba(8,27,35,.72);backdrop-filter:blur(3px)}
.gate[hidden]{display:none}
.gcard{width:min(480px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:16px;box-shadow:var(--sh2);padding:24px clamp(18px,4vw,28px)}
.gcard .kk{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);display:block}
.gcard h2{font-family:var(--display);font-weight:400;font-size:27px;margin:4px 0 12px;
  line-height:1.1;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.gcard p{margin:0 0 12px;font-size:14.5px;color:var(--muted);line-height:1.55}
.gcard p b,.gcard p code{color:var(--ink)}
.gcard code{font-family:var(--sans);font-weight:600;font-size:13px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:5px;padding:1px 5px}
.gcard .who{font-family:var(--sans);font-size:13px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin:0 0 13px;color:var(--ink);
  overflow-wrap:anywhere}
.gcard .grow2{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea,.btn{font-family:var(--sans)}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;position:relative;z-index:1}

/* ===========================================================================
   ENVIRONMENTAL BACKDROP
   The photograph behind everything lives in theme.css, shared with the other
   pages, and look.js points it at whatever THEME names — which is what makes
   the page behind the Appearance screen a live preview of the choice.
   ========================================================================= */



/* ---- top bar ---- */
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:9px clamp(10px,2vw,18px);
  background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--sh1);z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.brand .mk{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent)}
.brand .mk svg{width:16px;height:16px}
.brand .kk{font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block}
.brand h1{font-family:var(--display);font-weight:400;font-size:18px;margin:0;line-height:1.15;text-transform:uppercase;letter-spacing:.02em}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:6px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  cursor:pointer;transition:border-color .18s,color .18s,background .18s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
.btn.solid:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.danger{color:var(--alert);border-color:var(--alert-line)}
.btn.sm{padding:4px 8px;font-size:11.5px;border-radius:6px}
.btn svg{width:13px;height:13px;flex:none}
.dirty{font-family:var(--sans);font-size:11.5px;color:var(--risk);display:none;align-items:center;gap:5px}
.dirty.on{display:inline-flex}
.dirty i{width:7px;height:7px;border-radius:50%;background:var(--risk-line);display:block}
.dirty.saved{color:var(--good)}
.dirty.saved i{background:var(--good-line)}
.dirty.failed{color:var(--alert)}
.dirty.failed i{background:var(--alert-line)}
.warnbtn{font-family:var(--sans);font-size:11.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--alert-line);background:var(--alert-bg);color:var(--alert);
  border-radius:999px;padding:4px 11px}
.warnbtn:hover{filter:brightness(1.04)}
.detached b{display:block;margin-bottom:3px}
.detached .ed{margin-top:7px}
.detached .ed>span{color:var(--risk)}

/* ---- layout ---- */
.main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0;overflow:hidden;cursor:grab}
.stage.grabbing{cursor:grabbing}
.viewport{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.nodes{position:absolute;left:0;top:0}

/* ---- tree nodes ---- */
.qcard,.ocard{position:absolute;background:var(--surface);border:1.5px solid var(--border-strong);
  border-radius:11px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh1);
  transition:border-color .16s,box-shadow .16s,transform .14s var(--ease)}
.qcard{border-color:var(--accent);border-width:2px}
.qcard.risky{border-color:var(--risk-line);background:var(--risk-bg)}
.qcard:hover,.ocard:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:var(--accent)}
.qcard .tag,.ocard .tag{font-family:var(--sans);font-weight:600;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}
.qcard.risky .tag{color:var(--risk)}
.qcard .ttl{font-family:var(--serif);font-weight:600;font-size:14.5px;line-height:1.25;display:block}
.ocard .ttl{font-weight:650;font-size:13px;line-height:1.3;display:block}
.ocard .meta{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-top:4px;display:block}
.ocard .meta b{color:var(--good);font-weight:600}
.ocard.unlinked{border-color:var(--alert-line);background:var(--alert-bg)}
.qcard.orphan{border-style:dashed;opacity:.75}
.qcard[draggable="true"],.ocard[draggable="true"]{cursor:grab}
.qcard.dragging,.ocard.dragging{opacity:.32}
.ghost{opacity:.9;transform-origin:0 0;box-shadow:var(--sh2);transition:none}

/* ---- connection dots ---- */
.port{position:absolute;left:50%;width:13px;height:13px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-strong);
  transform:translateX(-50%) scale(var(--pz,1));transform-origin:50% 50%;
  transition:border-color .15s,background .15s;z-index:4}
/* a generous invisible target around each dot, so it is grabbable at any zoom */
.port::before{content:'';position:absolute;inset:-9px;border-radius:50%}
.port.out{bottom:-8px;cursor:crosshair}
.port.in{top:-8px}
.qcard:hover .port,.ocard:hover .port{border-color:var(--accent)}
.port.out:hover{border-color:var(--accent);background:var(--accent);
  transform:translateX(-50%) scale(calc(var(--pz,1) * 1.4))}
/* while a wire is being pulled, every place it could land shows itself */
.port.in.open{border-color:var(--good-line);background:var(--good-bg);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--good-bg) 70%,transparent)}
.port.in.hot{border-color:var(--good);background:var(--good);
  transform:translateX(-50%) scale(calc(var(--pz,1) * 1.55));box-shadow:0 0 0 6px var(--good-bg)}
body.wiring{cursor:crosshair}
body.wiring .qcard,body.wiring .ocard{cursor:crosshair}
.edge.wire{stroke:var(--border-strong);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}
.edge.wire.live{stroke:var(--good);stroke-width:3;stroke-dasharray:none}
.qcard.dropok,.ocard.dropok{border-color:var(--good-line);background:var(--good-bg);
  box-shadow:0 0 0 4px var(--good-bg),var(--sh2)}
.qcard.dropok::after,.ocard.dropok::after{content:'drop to reorder';position:absolute;bottom:6px;right:9px;
  font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--good)}
/* a drop that cannot do what it looks like it would */
/* a question being dropped onto an option: this option will lead to it */
.ocard.dropattach{border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 4px var(--accent-soft),var(--sh2)}
.ocard.dropattach::after{content:'lead to it';position:absolute;bottom:6px;right:9px;
  font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--accent-ink)}
.detached{margin-top:8px;padding:7px 9px;border-radius:7px;background:var(--risk-bg);
  border:1px solid var(--risk-line);font-family:var(--sans);font-size:10.5px;color:var(--risk);line-height:1.35}
.qcard.dropno{border-color:var(--risk-line);background:var(--risk-bg)}
.qcard.dropno::after{content:'different row — repoint an option instead';position:absolute;bottom:6px;left:10px;right:10px;
  font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--risk)}
/* ---- a card opened for editing ----
   The card becomes the form. Fields are fixed height so the layout measured
   when the card opened stays true while you type: the tree never reflows
   under the cursor. */
.qcard.editing,.ocard.editing{cursor:default;box-shadow:var(--sh2);border-color:var(--accent);
  outline:3px solid var(--accent-soft);outline-offset:2px;transform:none}
.qcard.editing:hover,.ocard.editing:hover{transform:none}
/* the drag handle on an open card */
.grip{display:flex;align-items:center;gap:7px;margin:-2px 0 9px;padding:5px 7px;cursor:grab;
  border:1px dashed var(--border-strong);border-radius:7px;background:var(--bg);
  font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);user-select:none}
.grip:hover{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.grip:active{cursor:grabbing}
.grip .dots{font-size:13px;letter-spacing:0;line-height:1}
.ed{display:block;margin:0 0 7px}
.ed:last-child{margin-bottom:0}
.ed>span{display:block;font-family:var(--sans);font-weight:600;font-size:8.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.ed input,.ed textarea,.ed select{width:100%;background:var(--bg);color:var(--ink);
  border:1px solid var(--border-strong);border-radius:6px;padding:6px 8px;font-size:12.5px;display:block}
.ed input,.ed select{font-family:var(--sans)}
.ed textarea{font-family:var(--serif);font-size:13.5px;line-height:1.35;resize:none}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.edbar{display:flex;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);flex-wrap:wrap}
.edbar button{font-family:var(--sans);font-size:10.5px;font-weight:600;border-radius:5px;padding:4px 7px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);cursor:pointer}
.edbar button:hover{border-color:var(--accent);color:var(--accent-ink)}
.edbar button.danger{color:var(--alert);border-color:var(--alert-line)}
.edbar .spacer{flex:1}
.edbar .done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qcard .badge,.ocard .badge{position:absolute;top:-8px;right:8px;font-family:var(--sans);font-size:10.5px;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;
  background:var(--alert-line);color:#fff}
.termcard{position:absolute;background:var(--good-bg);border:1.5px dashed var(--good-line);border-radius:11px;
  padding:9px 12px;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--good);text-align:center}

.addopt{position:absolute;width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--border-strong);
  background:var(--surface);color:var(--accent);font-size:16px;line-height:1;cursor:pointer;
  display:grid;place-items:center;padding:0;transition:.16s}
.addopt:hover{border-color:var(--accent);border-style:solid;background:var(--accent);color:var(--on-accent);transform:scale(1.1)}

.edge{fill:none;stroke:var(--border-strong);stroke-width:1.8}
.edge.term{stroke:var(--good-line);stroke-dasharray:5 4}
.edge.bad{stroke:var(--alert-line);stroke-width:2.4}
.edge.hot{stroke:var(--accent);stroke-width:3}

/* ---- inspector ---- */
.side{flex:none;width:min(400px,42vw);border-left:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;min-height:0}
@media (max-width:900px){ .main{flex-direction:column} .side{width:auto;flex:1;border-left:none;border-top:1px solid var(--border)} .stage{flex:none;height:48vh} }
/* full-width mode: the inspector folds away and the canvas takes the screen.
   Inline editing on the cards means nothing is out of reach while it is shut. */
body.wide .side{display:none}
body.wide #zWide{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--border);background:var(--surface-2)}
.tabs button{flex:1;border:none;background:transparent;padding:9px 6px;font-size:12px;font-weight:600;
  color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);background:var(--surface)}
.pane{flex:1;overflow-y:auto;padding:16px}
.pane h2{font-family:var(--display);font-weight:400;font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
.pane .sub{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin:0 0 16px}
.empty{font-family:var(--sans);color:var(--faint);font-size:13px;text-align:center;padding:40px 12px}

.f{margin:0 0 13px}
.f label{display:block;font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:var(--track);
  text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.f .hint{font-family:var(--sans);font-size:11px;color:var(--faint);margin-top:3px}
input[type=text],textarea,select{width:100%;background:var(--bg);color:var(--ink);
  border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:var(--serif)}
select,input[type=text]{font-family:var(--sans)}
textarea{font-family:var(--serif);line-height:1.45;resize:vertical;min-height:64px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row .btn{flex:none}
.chk{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:13px}
.chk input{width:auto;flex:none}

.olist{display:grid;gap:8px;margin-top:6px}
.oitem{border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--bg)}
.oitem .top{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.oitem .n{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:5px;padding:2px 6px;flex:none}
.oitem .lbl{flex:1;font-weight:650;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.sec{font-family:var(--sans);font-weight:700;font-size:10.5px;letter-spacing:var(--track);text-transform:uppercase;
  color:var(--risk-line);margin:22px 0 9px;padding-top:14px;border-top:1px solid var(--border)}
.sec:first-of-type{border-top:none;padding-top:0;margin-top:0}

.issues{display:grid;gap:7px}
.issue{border-left:3px solid var(--alert-line);background:var(--alert-bg);border-radius:7px;padding:8px 10px;
  font-family:var(--sans);font-size:12px;cursor:pointer}
.issue.warn{border-left-color:var(--risk-line);background:var(--risk-bg)}
.issue b{display:block;font-size:12.5px;margin-bottom:2px}
.ok{font-family:var(--sans);font-size:12.5px;color:var(--good);background:var(--good-bg);
  border-radius:8px;padding:10px 12px;text-align:center}

.zoom{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom .btn{background:var(--surface);box-shadow:var(--sh1);padding:6px 8px}
.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:5;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-family:var(--sans);font-size:11.5px;
  color:var(--muted);box-shadow:var(--sh1);pointer-events:none;white-space:nowrap;max-width:calc(100% - 120px);overflow:hidden;text-overflow:ellipsis}
.tip b{color:var(--accent-ink);font-weight:700}

/* ---- the Content tab's own sections ----
   The tab grew from three blocks to everything a reader reads, and one long
   scroll of it would bury the contact details under ten sections of guide.
   So it is sectioned, with a row of pills to move between them. */
.cnav{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 16px}
.cnav button{font-family:var(--sans);font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 10px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);cursor:pointer}
.cnav button:hover{border-color:var(--accent);color:var(--accent-ink)}
.cnav button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.f .reset{display:inline-block;margin-top:4px;border:none;background:none;padding:0;cursor:pointer;
  font-family:var(--sans);font-size:11px;font-weight:600;color:var(--accent-ink);text-decoration:underline}
textarea.html{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.45}
.oitem .top .btn{flex:none}
/* grid and flex items refuse to shrink below their content by default, so a
   long title or a wide line of HTML would widen the whole panel sideways */
.olist>.oitem,.oitem .top .lbl{min-width:0}
.oitem .top .btn:disabled{opacity:.4;cursor:default}
.oitem .meta{font-family:var(--sans);font-size:11px;color:var(--faint);margin:-2px 0 6px}
.oitem .body{margin-top:10px}
.vhead{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink);margin:16px 0 2px}
.vhead span{display:block;font-weight:400;font-size:11px;color:var(--faint)}
/* The preview is the reader's prose styling, roughly: enough that a stray
   tag or an unclosed <b> shows up here rather than in front of Council. */
.prev{border:1px dashed var(--border-strong);border-radius:8px;padding:10px 12px;background:var(--surface);
  font-size:14px;line-height:1.55;margin:0 0 13px;overflow-wrap:anywhere}
.prev>:first-child{margin-top:0}
.prev p{margin:0 0 9px}
.prev ul,.prev ol{margin:6px 0 9px;padding-left:20px}
.prev b{font-weight:650}
.prev code{font-family:var(--sans);font-weight:600;font-size:12px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:5px;padding:1px 5px}
.prev .wnote{margin:11px 0 2px;border-left:3px solid var(--risk);background:var(--risk-bg);
  border-radius:0 9px 9px 0;padding:9px 12px;font-size:13px}
.prev .wnote b{color:var(--risk)}
.prevk{font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin:0 0 4px}
/* The appearance screen. The thumbnail reads the same custom properties as
   the backdrop, so it shows the focal point at full strength while the page
   behind shows the photograph as readers will see it. */
.lookthumb{height:130px;border-radius:10px;border:1px solid var(--border);margin:0 0 13px;
  background-color:var(--surface-2);background-image:var(--photo-url,url("land.jpg"));
  background-size:cover;background-position:var(--photo-pos,50% 56%);
  display:flex;align-items:center;justify-content:center;font-family:var(--sans);font-size:12px;color:var(--faint)}
.radios{display:grid;gap:6px;margin:0 0 13px}
.radios label{display:flex;align-items:flex-start;gap:8px;font-family:var(--sans);font-size:13px;cursor:pointer}
.radios input{width:auto;flex:none;margin-top:3px}
.radios label.off{color:var(--faint);cursor:default}
.radios small{display:block;font-size:11px;color:var(--faint)}
.rng{display:flex;align-items:center;gap:10px}
.rng input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.rng output{font-family:var(--sans);font-size:12px;font-weight:600;min-width:42px;text-align:right}
.rng .chk{flex:none;font-size:12px}
.upmsg{font-family:var(--sans);font-size:12px;line-height:1.45;border-radius:8px;padding:8px 10px;margin:0 0 13px;
  background:var(--surface-2);color:var(--muted)}
.upmsg.bad{background:var(--alert-bg);color:var(--alert)}
.upmsg.good{background:var(--good-bg);color:var(--good)}
.rights{font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--muted);border-left:3px solid var(--risk-line);
  background:var(--risk-bg);border-radius:0 8px 8px 0;padding:9px 12px;margin:16px 0 0}
.rights b{color:var(--ink)}

dialog{border:none;border-radius:14px;padding:0;background:var(--surface);color:var(--ink);
  box-shadow:var(--sh2);max-width:min(560px,92vw);width:100%}
dialog::backdrop{background:rgba(8,27,35,.55)}

<!-- the canvas arithmetic the tree and the editor share -->
<script src="view.js"></script>
<script src="tree-data.js"></script>
<!-- the backdrop photograph, as the content describes it: this page applies
     the working copy's THEME to its own backdrop, so the editor is the preview -->
<script src="look.js"></script>
<!-- Accounts and saved trees. The editor works without it: the working copy
     lives in this browser either way, and "My trees" then explains why it
     cannot go any further than that. -->
<script>/* the editor gates the whole page on one account, so it declines the
     account chip: a "Sign in" button in a toolbar the page will not show you
     until you have signed in is offering something already insisted on. */
  window.TAS_CHIP=false;</script>
<script src="account.js"></script>
<script>
"use strict";
/* ===========================================================================
   THE WORKING COPY
   Edits happen on T, never on the loaded defaults, so Revert is always honest.
   ========================================================================= */
var DRAFT_KEY='tas-tree-draft';
var BASE=(window.TAS_TREE||{NODES:{},OUT:{},NONTAS:[],CRITERIA:[],NEXT:[],LINKS:[],
                            DISC:{},CONTACT:{},GUIDE:[],COPY:{},THEME:{}});
/* The seven disclaimer placements, in the order a reader meets them. */
var DISC_FIELDS=[
  ['bar','The standing bar',   'One line, under the top bar for the whole session. Plain text \u2014 no tags.'],
  ['guide','In the guide',     'The \u201cwhat this tool is not\u201d box, high in the guide. HTML.'],
  ['boundary','Boundary risk', 'The danger card in the result, when a boundary answer came up. HTML.'],
  ['authority','Eligibility is not authority','Its own card in the result, above the criteria. HTML.'],
  ['result','Foot of the result','Closing note in the result panel. HTML.'],
  ['print','On the print-out', 'This one has to stand alone months later with none of the tool around it. HTML.'],
  ['cites','About the citations','Printed and shown at the foot of the result. HTML.']
];
var CONTACT_FIELDS=[
  ['name','Name',''],
  ['role','Role or title',''],
  ['email','Email','Without this the Contact panel can only offer \u201ccopy the text\u201d.'],
  ['phone','Phone',''],
  ['calendly','Calendly event link','The Calendly link for the event people should book \u2014 e.g. https://calendly.com/your-name/30min. It embeds in the Contact panel, and whatever the reader typed in the question box is carried into it as a prefill. Another scheduling service still works as a link, it just will not embed.']
];
function clone(o){ return JSON.parse(JSON.stringify(o)); }
/* Content from anywhere but tree-data.js — the draft in this browser, a
   pasted Import, a tree off the account — goes through look.js cleanTree, the
   browser copy of the server's markup filter, before it becomes T. The
   previews here are inert whatever T holds, but T is also what Export writes
   into a file for the repo and what Publish sends, so hostile markup left in
   it would travel. Returns null for what is not a tree with questions, and
   when there is no filter to run (look.js did not load): the caller decides
   what that means for its source. */
function cleanContent(d){
  var L=window.TAS_LOOK;
  if(!L||typeof L.cleanTree!=='function') return null;
  var c=L.cleanTree(d);
  if(!c||!c.NODES||typeof c.NODES!=='object'||Array.isArray(c.NODES)) return null;
  return c;
}
var T=clone(BASE), dirty=false, sel=null;   /* sel = {kind:'q'|'o', id, ai} */
/* A draft that is there but could not be checked is not opened — and not
   overwritten either, since the first edit would otherwise save over the
   only copy of someone's work. Reset (or an Import, or opening a saved tree)
   is the deliberate way past it. */
var draftHeld=false;
(function(){
  var raw=null, d=null;
  try{ raw=localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  try{ d=cleanContent(JSON.parse(raw)); }catch(e){ d=null; }
  if(d) T=d; else draftHeld=true;
})();
/* a draft written before the disclaimer set was split still opens */
normaliseCopy();
/* the editor's own backdrop shows the working copy's photograph from the
   first paint, so what is on screen is what Publish would put out */
applyLook();

var TERMINALS={END:'Result',END_NONTAS:'Non-TAS pathways'};
function isTerminal(id){ return TERMINALS.hasOwnProperty(id); }
function questionIds(){ return Object.keys(T.NODES); }
/* Edits save themselves. Export used to be the only obvious button after a
   change, and Export writes nothing — it hands you a file — so an edit could
   look applied while the tree still showed the old content. Nothing about the
   editor and the tree can disagree now. */
var saveTimer=null;
var HELD_TEXT='the draft already in this browser could not be checked, so it has been left '
  +'as it was — Reset replaces it';
function saveNow(){
  if(draftHeld){ setStatus('failed',HELD_TEXT); return; }
  try{
    localStorage.setItem(DRAFT_KEY,JSON.stringify(T));
    setStatus('saved');
  }catch(e){ setStatus('failed',e.message); }
}
function setStatus(state,detail){
  var el=document.getElementById('dirty');
  el.className='dirty on '+state;
  el.innerHTML=state==='saved'
    ? '<i></i>Saved to this browser'
    : (state==='failed' ? '<i></i>Could not save: '+esc(detail||'') : '<i></i>Saving…');
}
function markDirty(v){
  dirty=v!==false;
  if(!dirty){ document.getElementById('dirty').className='dirty'; return; }
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,400);
}

function nextQid(){
  var n=2;
  while(T.NODES['q'+n]) n++;
  return 'q'+n;
}

/* ===========================================================================
   LAYOUT — layered, longest path from the root, options fanned under each
   question. Any option may point at any question, so edges can cross; this is
   an editor, and seeing the real wiring matters more than a tidy picture.
   ========================================================================= */
var QW=286, OW=178, OGAP=10, VGAP=44, UNITGAP=54, ROOT='q1';
var nodesEl=document.getElementById('nodes'), edgesEl=document.getElementById('edges');
var stage=document.getElementById('stage'), vp=document.getElementById('viewport');
var view={tx:40,ty:30,s:.85};
/* Keep the tree on screen. Panning was unbounded, so a scroll or a drag could
   carry the canvas off into empty space with no landmark to get back by. The
   view is held so the tree always overlaps the stage with a margin; on an axis
   where the tree is smaller than the stage it simply centres. */
var PAN_MARGIN=120;
function clampView(){
  if(!window.__box||!window.TASView) return;
  TASView.clamp(view,stage.getBoundingClientRect(),window.__box,PAN_MARGIN);
}
function applyView(){
  clampView();
  vp.style.transform='translate('+view.tx+'px,'+view.ty+'px) scale('+view.s+')';
  /* hold the connection dots at a constant size on screen, capped so they do
     not balloon when the tree is zoomed right out */
  vp.style.setProperty('--pz',Math.min(1/view.s,2.6).toFixed(3));
}

function layers(){
  var L={}, ids=questionIds();
  if(!ids.length) return L;
  ids.forEach(function(id){ L[id]=0; });
  for(var pass=0;pass<ids.length+2;pass++){
    var moved=false;
    ids.forEach(function(id){
      (T.NODES[id].a||[]).forEach(function(a){
        if(a.to&&T.NODES[a.to]&&L[a.to]<L[id]+1){ L[a.to]=L[id]+1; moved=true; }
      });
    });
    if(!moved) break;
  }
  return L;
}
function reachable(){
  var seen={}, stack=[ROOT];
  if(!T.NODES[ROOT]) return seen;
  while(stack.length){
    var id=stack.pop();
    if(!T.NODES[id]||seen[id]) continue;
    seen[id]=1;
    (T.NODES[id].a||[]).forEach(function(a){ if(a.to&&T.NODES[a.to]) stack.push(a.to); });
  }
  return seen;
}

/* An opened option is wider than a closed one. Both the layer packing and the
   fan itself measure through this, so the siblings move aside to make room
   instead of being sat on. */
var OWE=OW+58;
function optWidths(id){
  return (T.NODES[id].a||[]).map(function(a,ai){
    return (sel&&sel.kind==='o'&&sel.id===id&&sel.ai===ai)?OWE:OW;
  });
}
function fanWidth(id){
  var ws=optWidths(id);
  if(!ws.length) return QW;
  return ws.reduce(function(a,b){return a+b;},0)+OGAP*(ws.length-1);
}
function render(){
  nodesEl.innerHTML=''; edgesEl.innerHTML='';
  var L=layers(), reach=reachable(), ids=questionIds();
  var byLayer={};
  ids.forEach(function(id){ (byLayer[L[id]]=byLayer[L[id]]||[]).push(id); });
  var layerKeys=Object.keys(byLayer).map(Number).sort(function(a,b){return a-b;});

  var pos={}, y=0, maxRight=0;
  layerKeys.forEach(function(li){
    var units=byLayer[li], widths=units.map(function(id){
      return Math.max(QW, fanWidth(id)+40);
    });
    var totalW=widths.reduce(function(a,b){return a+b;},0)+UNITGAP*(units.length-1);
    var x=-totalW/2;
    var rowH=0;
    units.forEach(function(id,i){
      var n=T.NODES[id], opts=n.a||[];
      var cx=x+widths[i]/2;
      var editingQ=!!(sel&&sel.kind==='q'&&sel.id===id);
      var qEl=document.createElement('div');
      qEl.className='qcard'+(n.risky?' risky':'')+(reach[id]?'':' orphan')+(editingQ?' editing':'');
      qEl.style.width=QW+'px';
      qEl.dataset.qid=id;
      if(editingQ){
        var grip=document.createElement('div');
        grip.className='grip';
        grip.innerHTML='<span class="dots">⠿</span> Drag onto an option to attach this question';
        grip.title='Drag this onto any option — that option will then lead to this question';
        qEl.appendChild(grip);
        dragFrom(qEl,{kind:'q',id:id},grip);
        qEl.appendChild(edText('Label above the question',n.tag,function(v){ n.tag=v; }));
        qEl.appendChild(edArea('The question',n.q,3,function(v){ n.q=v; }));
        qEl.appendChild(edText('Short name',n.short,function(v){ n.short=v; }));
        qEl.appendChild(edArea('Note under it (optional)',n.note,2,function(v){ n.note=v; }));
        var qbar=document.createElement('div'); qbar.className='edbar';
        if(!reach[id]){
          var warn=document.createElement('div');
          warn.className='detached';
          warn.innerHTML='<b>No way in.</b> A reader can never reach this question, '
            +'because no option leads to it. Pointing this question at an ending is not '
            +'enough — something has to point AT it.';
          /* fix it from here, rather than making the reader go hunting */
          var opts=[{v:'',t:'— pick an option to lead here —'}];
          questionIds().forEach(function(oq){
            if(oq===id) return;
            (T.NODES[oq].a||[]).forEach(function(oa,oi){
              opts.push({v:oq+':'+oi,t:(T.NODES[oq].tag||oq)+' → '+(oa.label||('option '+(oi+1)))});
            });
          });
          var pick=edSelect('Wire it in',' ',opts,function(v){
            if(!v) return;
            var bits=v.split(':');
            setTarget(bits[0],+bits[1],id);
          });
          warn.appendChild(pick);
          qEl.appendChild(warn);
        }
        qbar.appendChild(edBtn('+ option',function(){ addOption(id); }));
        qbar.appendChild(edBtn(n.risky?'Risk styling: on':'Risk styling: off',function(){
          n.risky=!n.risky; markDirty(); render(); }));
        qbar.appendChild(edBtn('Delete',function(){ removeQuestion(id); },'danger'));
        var qsp=document.createElement('span'); qsp.className='spacer'; qbar.appendChild(qsp);
        qbar.appendChild(edBtn('Done',function(){ sel=null; render(); },'done'));
        qEl.appendChild(qbar);
        stopBubble(qEl);
      } else {
        qEl.innerHTML='<span class="tag">'+esc(n.tag||id)+'</span><span class="ttl">'+esc(n.q||'(no question text)')+'</span>'
          +(reach[id]?'':'<span class="badge">unreachable</span>');
        qEl.onclick=function(ev){ ev.stopPropagation(); if(swallowClick) return; select({kind:'q',id:id}); };
        qEl.title="Drag onto another question in the same row to reorder it. A row is set by what points at the question — repoint an option to move it up or down.";
        dragFrom(qEl,{kind:'q',id:id});
      }
      /* after the content: the collapsed branch assigns innerHTML, which
         would wipe a port added before it */
      addPort(qEl,'in',id);
      nodesEl.appendChild(qEl);
      var qh=qEl.offsetHeight;
      qEl.style.left=(cx-QW/2)+'px'; qEl.style.top=y+'px';
      pos[id]={x:cx,y:y,h:qh,w:QW};

      /* options fan */
      var ws=optWidths(id);
      var oTotal=fanWidth(id);
      var ox=cx-oTotal/2, oy=y+qh+VGAP, oh=0, runX=ox;
      opts.forEach(function(a,ai){
        var oEl=document.createElement('div');
        var bad=!a.to||(!T.NODES[a.to]&&!isTerminal(a.to));
        var editingO=!!(sel&&sel.kind==='o'&&sel.id===id&&sel.ai===ai);
        oEl.className='ocard'+(bad?' unlinked':'')+(editingO?' editing':'');
        oEl.style.width=ws[ai]+'px';
        oEl.dataset.qid=id; oEl.dataset.ai=String(ai);
        if(editingO){
          (function(qid,idx,ans){
            oEl.appendChild(edArea('Option '+(idx+1)+' label',ans.label,2,function(v){ ans.label=v; }));
            oEl.appendChild(edText('Short form',ans.short,function(v){ ans.short=v; }));
            oEl.appendChild(edText('Hint under the label (optional)',ans.hint,function(v){ ans.hint=v; }));
            oEl.appendChild(edArea('Note once chosen (optional)',ans.note,2,function(v){ ans.note=v; }));
            oEl.appendChild(edArea('Detail in the result (optional, HTML)',ans.detail,3,function(v){ ans.detail=v; }));
            oEl.appendChild(edSelect('Leads to',ans.to,targetOptions(),function(v){
              if(v==='__new__'){ addQuestion({id:qid,ai:idx}); return; }
              ans.to=v; markDirty(); render();
            }));
            oEl.appendChild(edSelect('Unlocks pathway',ans.grants||'',pathwayOptions(),function(v){
              ans.grants=v; markDirty(); render();
            }));
            var ob=document.createElement('div'); ob.className='edbar';
            ob.appendChild(edBtn('Delete',function(){ removeOption(qid,idx); },'danger'));
            var osp=document.createElement('span'); osp.className='spacer'; ob.appendChild(osp);
            ob.appendChild(edBtn('Done',function(){ sel=null; render(); },'done'));
            oEl.appendChild(ob);
          })(id,ai,a);
          stopBubble(oEl);
        } else {
          var dest=!a.to?'nowhere':(isTerminal(a.to)?TERMINALS[a.to]:(T.NODES[a.to]?(T.NODES[a.to].short||a.to):a.to+' (missing)'));
          oEl.innerHTML='<span class="tag">Option '+(ai+1)+'</span>'
            +'<span class="ttl">'+esc(a.label||'(no label)')+'</span>'
            +'<span class="meta">→ '+esc(dest)+(a.grants?' · <b>+'+esc((T.OUT[a.grants]||{}).name||a.grants)+'</b>':'')+'</span>'
            +(bad?'<span class="badge">no target</span>':'');
          oEl.onclick=function(ev){ ev.stopPropagation(); if(swallowClick) return; select({kind:'o',id:id,ai:ai}); };
          oEl.title='Drag onto a sibling to reorder. Drop a question here to make this option lead to it.';
          dragFrom(oEl,{kind:'o',id:id,ai:ai});
        }
        addPort(oEl,'out',id,ai);
        nodesEl.appendChild(oEl);
        oEl.style.left=runX+'px'; oEl.style.top=oy+'px';
        oh=Math.max(oh,oEl.offsetHeight);
        pos[id+'#'+ai]={x:runX+ws[ai]/2,y:oy,h:oEl.offsetHeight,w:ws[ai],el:oEl};
        runX+=ws[ai]+OGAP;
      });
      /* add-option affordance */
      var add=document.createElement('button');
      add.className='addopt'; add.textContent='+'; add.title='Add an option to this question';
      add.onclick=function(ev){ ev.stopPropagation(); addOption(id); };
      nodesEl.appendChild(add);
      add.style.left=(ox+oTotal+14)+'px';
      add.style.top=(oy+Math.max(oh,30)/2-13)+'px';

      rowH=Math.max(rowH,qh+VGAP+oh);
      maxRight=Math.max(maxRight,ox+oTotal+50);
      x+=widths[i]+UNITGAP;
    });
    y+=rowH+UNITGAP+18;
  });

  /* terminals sit under everything */
  var termY=y, tpos={};
  Object.keys(TERMINALS).forEach(function(t,i){
    var el=document.createElement('div');
    el.className='termcard'; el.textContent=TERMINALS[t];
    el.dataset.qid=t;
    nodesEl.appendChild(el);
    addPort(el,'in',t);
    el.style.left=(-140+i*220)+'px'; el.style.top=termY+'px';
    tpos[t]={x:-140+i*220+el.offsetWidth/2,y:termY,h:el.offsetHeight};
  });

  /* normalise to positive space */
  var all=Array.prototype.slice.call(nodesEl.children);
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  all.forEach(function(el){
    var l=parseFloat(el.style.left),t=parseFloat(el.style.top);
    minX=Math.min(minX,l); minY=Math.min(minY,t);
    maxX=Math.max(maxX,l+el.offsetWidth); maxY=Math.max(maxY,t+el.offsetHeight);
  });
  var padX=60,padY=40,dx=padX-minX,dy=padY-minY;
  all.forEach(function(el){
    el.style.left=(parseFloat(el.style.left)+dx)+'px';
    el.style.top=(parseFloat(el.style.top)+dy)+'px';
  });
  Object.keys(pos).forEach(function(k){ pos[k].x+=dx; pos[k].y+=dy; });
  Object.keys(tpos).forEach(function(k){ tpos[k].x+=dx; tpos[k].y+=dy; });
  var W=maxX-minX+padX*2, H=maxY-minY+padY*2;
  edgesEl.setAttribute('width',W); edgesEl.setAttribute('height',H);
  edgesEl.setAttribute('viewBox','0 0 '+W+' '+H);
  window.__box={w:W,h:H};

  /* edges: option -> its destination */
  ids.forEach(function(id){
    (T.NODES[id].a||[]).forEach(function(a,ai){
      var from=pos[id+'#'+ai]; if(!from) return;
      var to=a.to&&T.NODES[a.to]?pos[a.to]:(isTerminal(a.to)?tpos[a.to]:null);
      if(!to) return;
      var x1=from.x,y1=from.y+from.h,x2=to.x,y2=to.y;
      var dyy=Math.max(22,Math.abs(y2-y1)/2);
      var d='M'+x1+','+y1+' C'+x1+','+(y1+dyy)+' '+x2+','+(y2-dyy)+' '+x2+','+y2;
      var p=document.createElementNS('http://www.w3.org/2000/svg','path');
      var hot=sel&&((sel.kind==='o'&&sel.id===id&&sel.ai===ai)||(sel.kind==='q'&&sel.id===id));
      p.setAttribute('class','edge'+(isTerminal(a.to)?' term':'')+(hot?' hot':''));
      p.setAttribute('d',d);
      edgesEl.appendChild(p);
    });
  });
  /* question -> its own options */
  ids.forEach(function(id){
    var q=pos[id]; if(!q) return;
    (T.NODES[id].a||[]).forEach(function(a,ai){
      var o=pos[id+'#'+ai]; if(!o) return;
      var x1=q.x,y1=q.y+q.h,x2=o.x,y2=o.y;
      var dyy=Math.max(14,(y2-y1)/2);
      var p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','edge'+(sel&&sel.kind==='q'&&sel.id===id?' hot':''));
      p.setAttribute('d','M'+x1+','+y1+' C'+x1+','+(y1+dyy)+' '+x2+','+(y2-dyy)+' '+x2+','+y2);
      edgesEl.insertBefore(p,edgesEl.firstChild);
    });
  });
  applyView();
  renderPane();
  refreshWarning();
}
/* unreachable questions are the one mistake that looks like nothing is wrong,
   so it gets said in the toolbar rather than only inside a tab */
function refreshWarning(){
  var btn=document.getElementById('warnBtn');
  if(!btn) return;
  var reach=reachable();
  var lost=questionIds().filter(function(id){ return !reach[id]; });
  btn.hidden=!lost.length;
  if(lost.length){
    btn.textContent='⚠ '+lost.length+' question'+(lost.length>1?'s':'')+' no reader can reach';
    btn.onclick=function(){ select({kind:'q',id:lost[0]}); };
  }
}
/* ---- inline field builders -------------------------------------------------
   These write straight to the model on each keystroke and deliberately do NOT
   re-render: rebuilding the DOM mid-word would take the caret with it. A blur
   triggers one render so the rest of the page catches up. */
function stopBubble(el){
  ['click','pointerdown','mousedown','dblclick','wheel'].forEach(function(t){
    el.addEventListener(t,function(ev){ ev.stopPropagation(); });
  });
}
function edWrap(label,ctrl){
  var w=document.createElement('label'); w.className='ed';
  var s=document.createElement('span'); s.textContent=label;
  w.appendChild(s); w.appendChild(ctrl); return w;
}
function edCommit(ctrl,set){
  ctrl.addEventListener('input',function(){ set(ctrl.value); markDirty(); });
  ctrl.addEventListener('change',function(){ set(ctrl.value); markDirty(); render(); });
  ctrl.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){ ev.preventDefault(); ctrl.blur(); sel=null; render(); }
  });
}
function edText(label,val,set){
  var i=document.createElement('input'); i.type='text'; i.value=val==null?'':val;
  edCommit(i,set); return edWrap(label,i);
}
function edArea(label,val,rows,set){
  var t=document.createElement('textarea'); t.rows=rows||2; t.value=val==null?'':val;
  edCommit(t,set); return edWrap(label,t);
}
function edSelect(label,val,opts,onchange){
  var sl=document.createElement('select');
  opts.forEach(function(o){
    var op=document.createElement('option'); op.value=o.v; op.textContent=o.t;
    if(o.v===val) op.selected=true; sl.appendChild(op);
  });
  sl.addEventListener('change',function(){ onchange(sl.value); });
  return edWrap(label,sl);
}
function edBtn(text,fn,cls){
  var b=document.createElement('button'); b.type='button'; b.textContent=text;
  if(cls) b.className=cls;
  b.addEventListener('click',function(ev){ ev.stopPropagation(); fn(); });
  return b;
}
/* ---- dragging -------------------------------------------------------------
   Built on pointer events rather than HTML5 drag-and-drop. The canvas lives
   inside a transform: scale() container, which native DnD handles badly — the
   drag would start and then be refused with nothing to show for it. This does
   the hit-testing itself, so it behaves the same at any zoom.
   -------------------------------------------------------------------------- */
var DRAG=null, PD=null, swallowClick=false;

function canReach(from,target){
  var seen={},stack=[from];
  while(stack.length){
    var id=stack.pop();
    if(id===target) return true;
    if(!T.NODES[id]||seen[id]) continue;
    seen[id]=1;
    (T.NODES[id].a||[]).forEach(function(a){ if(a.to&&T.NODES[a.to]) stack.push(a.to); });
  }
  return false;
}
function qName(id){ return (T.NODES[id]&&(T.NODES[id].tag||T.NODES[id].short))||id; }

function reorderQuestions(fromId,toId){
  if(fromId===toId) return;
  var ids=questionIds(), i=ids.indexOf(fromId), j=ids.indexOf(toId);
  if(i<0||j<0) return;
  ids.splice(i,1);
  ids.splice(ids.indexOf(toId)+(j>i?1:0),0,fromId);
  var next={}; ids.forEach(function(id){ next[id]=T.NODES[id]; });
  T.NODES=next; markDirty(); render();
}
function reorderOptions(qid,from,to){
  var a=T.NODES[qid]&&T.NODES[qid].a;
  if(!a||from===to||from<0||to<0||from>=a.length||to>=a.length) return;
  a.splice(to,0,a.splice(from,1)[0]);
  markDirty(); sel={kind:'o',id:qid,ai:to}; render();
}
/* drop a question on an option and that option leads to it */
function attachQuestion(qid,ai,target){
  var a=T.NODES[qid]&&T.NODES[qid].a&&T.NODES[qid].a[ai];
  if(!a||!T.NODES[target]) return;
  if(target===qid){ alert('That option belongs to this question, so pointing it back at itself would be a loop of one.'); return; }
  if(a.to===target){ select({kind:'o',id:qid,ai:ai}); return; }
  if(canReach(target,qid)&&!confirm('"'+qName(target)+'" can already reach "'+qName(qid)+'". Attaching it here makes a loop a reader could go round forever. Attach anyway?')) return;
  a.to=target; markDirty(); select({kind:'o',id:qid,ai:ai});
}

/* ---- wiring by the dots ---------------------------------------------------
   Every option carries an output dot and every question and ending an input
   dot. Drag one to the other and the option is rewired, with a live line
   following the cursor while you do. Coordinates are converted through the
   canvas transform, so it lands where you point at any zoom.
   -------------------------------------------------------------------------- */
var WIRE=null;
function toCanvas(cx,cy){
  var r=stage.getBoundingClientRect();
  return [(cx-r.left-view.tx)/view.s,(cy-r.top-view.ty)/view.s];
}
function portCentre(el){
  var b=el.getBoundingClientRect();
  return toCanvas(b.left+b.width/2,b.top+b.height/2);
}
/* set an option's destination, question or ending, with the same guards */
function setTarget(qid,ai,target){
  var a=T.NODES[qid]&&T.NODES[qid].a&&T.NODES[qid].a[ai];
  if(!a||!target) return;
  if(isTerminal(target)){ a.to=target; markDirty(); select({kind:'o',id:qid,ai:ai}); return; }
  attachQuestion(qid,ai,target);
}
function startWire(qid,ai,fromEl){
  WIRE={qid:qid,ai:+ai,from:portCentre(fromEl),el:null};
  WIRE.el=document.createElementNS('http://www.w3.org/2000/svg','path');
  WIRE.el.setAttribute('class','edge wire');
  edgesEl.appendChild(WIRE.el);
  document.body.classList.add('wiring');
  autoPanStart();
  Array.prototype.forEach.call(document.querySelectorAll('.port.in'),function(pt){ pt.classList.add('open'); });
}
function moveWire(cx,cy){
  if(!WIRE) return;
  var to=toCanvas(cx,cy), x1=WIRE.from[0], y1=WIRE.from[1], x2=to[0], y2=to[1];
  var dy=Math.max(24,Math.abs(y2-y1)/2);
  WIRE.el.setAttribute('d','M'+x1+','+y1+' C'+x1+','+(y1+dy)+' '+x2+','+(y2-dy)+' '+x2+','+y2);
  var hit=portUnder(cx,cy);
  Array.prototype.forEach.call(document.querySelectorAll('.port.hot'),function(pt){ pt.classList.remove('hot'); });
  if(hit) hit.classList.add('hot');
  WIRE.el.classList.toggle('live',!!hit);
}
function portUnder(cx,cy){
  if(WIRE&&WIRE.el) WIRE.el.style.display='none';
  var el=document.elementFromPoint(cx,cy);
  if(WIRE&&WIRE.el) WIRE.el.style.display='';
  var pt=el&&el.closest?el.closest('.port.in'):null;
  if(!pt) return null;
  /* an option cannot be wired back into the question it belongs to */
  if(WIRE&&pt.dataset.qid===WIRE.qid) return null;
  return pt;
}
function endWire(cx,cy){
  if(!WIRE) return;
  var hit=portUnder(cx,cy), w=WIRE;
  if(w.el&&w.el.parentNode) w.el.parentNode.removeChild(w.el);
  document.body.classList.remove('wiring');
  Array.prototype.forEach.call(document.querySelectorAll('.port.open,.port.hot'),function(pt){
    pt.classList.remove('open','hot');
  });
  WIRE=null;
  if(hit) setTarget(w.qid,w.ai,hit.dataset.qid);
}

/* what, if anything, will accept what is being dragged */
function targetAt(x,y){
  if(PD&&PD.ghost) PD.ghost.style.display='none';
  var el=document.elementFromPoint(x,y);
  if(PD&&PD.ghost) PD.ghost.style.display='';
  if(!el) return null;
  var card=el.closest?el.closest('.qcard,.ocard'):null;
  if(!card||!DRAG) return null;
  var qid=card.dataset.qid, ai=card.dataset.ai;
  if(card.classList.contains('ocard')){
    if(DRAG.kind==='q') return (DRAG.id===qid)?{card:card,why:'self'}
      :{card:card,cls:'dropattach',act:function(){ attachQuestion(qid,+ai,DRAG.id); }};
    if(DRAG.kind==='o'&&DRAG.id===qid&&+ai!==DRAG.ai)
      return {card:card,cls:'dropok',act:function(){ reorderOptions(qid,DRAG.ai,+ai); }};
    return null;
  }
  if(DRAG.kind==='q'&&qid!==DRAG.id){
    var L=layers();
    if(L[qid]===L[DRAG.id]) return {card:card,cls:'dropok',act:function(){ reorderQuestions(DRAG.id,qid); }};
    return {card:card,why:'row'};
  }
  return null;
}
function clearMarks(){
  Array.prototype.forEach.call(document.querySelectorAll('.dropok,.dropattach,.dropno'),function(d){
    d.classList.remove('dropok','dropattach','dropno');
  });
}
function makeGhost(card){
  var g=card.cloneNode(true);
  g.className=card.className.replace(/dragging/g,'')+' ghost';
  g.style.position='fixed'; g.style.pointerEvents='none'; g.style.zIndex='999';
  g.style.width=card.offsetWidth*view.s+'px';
  g.style.left='0px'; g.style.top='0px'; g.style.margin='0';
  document.body.appendChild(g);
  return g;
}
/* ---- auto-pan while dragging ----------------------------------------------
   A drag holds the pointer down, so the wheel is not available and the target
   may well be off screen. Hold near an edge and the canvas comes to you. The
   existing clamp still applies, so it stops at the end of the tree.
   -------------------------------------------------------------------------- */
var AUTOPAN=null, LASTPT={x:0,y:0};
function repaintDragFeedback(){
  if(WIRE){ moveWire(LASTPT.x,LASTPT.y); return; }
  if(!(PD&&PD.active)) return;
  clearMarks();
  var t=targetAt(LASTPT.x,LASTPT.y);
  if(t&&t.cls) t.card.classList.add(t.cls);
  else if(t&&t.why==='row') t.card.classList.add('dropno');
}
function autoPanStop(){ if(AUTOPAN){ clearInterval(AUTOPAN); AUTOPAN=null; } }
function autoPanStart(){
  if(AUTOPAN) return;
  AUTOPAN=setInterval(function(){
    if(!WIRE&&!(PD&&PD.active)){ autoPanStop(); return; }
    var r=stage.getBoundingClientRect(), EDGE=84, MAX=16, dx=0, dy=0;
    /* speed rises the deeper into the edge band you hold, so it creeps when
       you are just inside it and moves properly when you are hard against it */
    function ramp(d){ return MAX*Math.min(1,Math.max(0,(EDGE-d)/EDGE)); }
    var dTop=LASTPT.y-r.top, dBot=r.bottom-LASTPT.y;
    var dLeft=LASTPT.x-r.left, dRight=r.right-LASTPT.x;
    if(dTop<EDGE) dy=ramp(dTop);
    else if(dBot<EDGE) dy=-ramp(dBot);
    if(dLeft<EDGE) dx=ramp(dLeft);
    else if(dRight<EDGE) dx=-ramp(dRight);
    if(Math.abs(dx)<0.5) dx=0;
    if(Math.abs(dy)<0.5) dy=0;
    if(!dx&&!dy) return;
    var tx0=view.tx, ty0=view.ty;
    view.tx+=dx; view.ty+=dy;
    applyView();                       /* clamped, so this stops at the edges */
    if(view.tx===tx0&&view.ty===ty0) return;
    repaintDragFeedback();
  },16);
}

/* start a drag from `handle`, moving `card`, carrying `payload` */
function dragFrom(card,payload,handle){
  (handle||card).addEventListener('pointerdown',function(ev){
    if(ev.button!==0) return;
    if(ev.target.closest('input,textarea,select,button')) return;
    PD={payload:payload,card:card,x0:ev.clientX,y0:ev.clientY,active:false,ghost:null};
    ev.stopPropagation();
  });
}
document.addEventListener('pointermove',function(ev){
  LASTPT.x=ev.clientX; LASTPT.y=ev.clientY;
  if(WIRE){ autoPanStart(); moveWire(ev.clientX,ev.clientY); return; }
  if(!PD) return;
  if(!PD.active){
    if(Math.abs(ev.clientX-PD.x0)+Math.abs(ev.clientY-PD.y0)<6) return;
    PD.active=true; DRAG=PD.payload;
    autoPanStart();
    PD.card.classList.add('dragging');
    PD.ghost=makeGhost(PD.card);
    document.body.style.cursor='grabbing';
  }
  PD.ghost.style.transform='translate('+(ev.clientX-30)+'px,'+(ev.clientY-16)+'px)';
  clearMarks();
  var t=targetAt(ev.clientX,ev.clientY);
  if(t&&t.cls) t.card.classList.add(t.cls);
  else if(t&&t.why==='row') t.card.classList.add('dropno');
});
document.addEventListener('pointerup',function(ev){
  autoPanStop();
  if(WIRE){ endWire(ev.clientX,ev.clientY); swallowClick=true; setTimeout(function(){ swallowClick=false; },0); return; }
  if(!PD) return;
  var wasDrag=PD.active;
  if(wasDrag){
    var t=targetAt(ev.clientX,ev.clientY);
    PD.card.classList.remove('dragging');
    if(PD.ghost&&PD.ghost.parentNode) PD.ghost.parentNode.removeChild(PD.ghost);
    document.body.style.cursor='';
    clearMarks();
    PD=null; 
    if(t&&t.act) t.act();
    DRAG=null;
    swallowClick=true; setTimeout(function(){ swallowClick=false; },0);
    return;
  }
  PD=null; DRAG=null;
});
/* the dots. out on options, in on questions and endings */
function addPort(card,dir,qid,ai){
  var pt=document.createElement('span');
  pt.className='port '+dir;
  pt.dataset.qid=qid;
  if(ai!=null) pt.dataset.ai=String(ai);
  pt.title=(dir==='out')
    ? 'Drag from here to a question or ending to set where this option leads'
    : 'Drop a connection here';
  card.appendChild(pt);
  if(dir==='out'){
    pt.addEventListener('pointerdown',function(ev){
      if(ev.button!==0) return;
      ev.stopPropagation(); ev.preventDefault();
      startWire(qid,ai,pt);
    });
  }
  return pt;
}
/* ONE definition of what escaping means, in account.js, which every page
   loads before this script runs. There used to be three, and they disagreed:
   this page's escaped neither quotes nor null, while its output goes into
   value="..." and href="..." in the contact panel — so a reader typing a
   double quote into their own name got a live event handler onto the input.
   The fallback is for account.js being absent, which these pages are built to
   survive, and it is the strict text rather than a fourth variant. */
var esc = (window.TAS && window.TAS.ui && window.TAS.ui.esc) || function(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};
function select(s){ sel=s; render(); }
stage.onclick=function(){ if(sel){ sel=null; render(); } };

/* ===========================================================================
   EDITS
   ========================================================================= */
function addOption(qid){
  var q=T.NODES[qid]; if(!q) return;
  q.a=q.a||[];
  q.a.push({label:'New option',short:'New',to:'',grants:''});
  markDirty(); select({kind:'o',id:qid,ai:q.a.length-1});
}
function removeOption(qid,ai){
  var q=T.NODES[qid]; if(!q||!q.a) return;
  if(q.a.length<=1){ alert('A question needs at least one option. Delete the question instead.'); return; }
  q.a.splice(ai,1); markDirty(); select({kind:'q',id:qid});
}
function addQuestion(afterOpt){
  var id=nextQid();
  var n=questionIds().length+1;
  T.NODES[id]={tag:'Question '+n,short:'New question',q:'A new question',
               a:[{label:'Option 1',short:'Option 1',to:'END',grants:''}]};
  if(afterOpt){
    var q=T.NODES[afterOpt.id];
    if(q&&q.a[afterOpt.ai]) q.a[afterOpt.ai].to=id;
  }
  markDirty(); select({kind:'q',id:id});
  return id;
}
function removeQuestion(qid){
  if(qid===ROOT){ alert('The first question is the root of the tree and cannot be deleted.'); return; }
  var pointing=[];
  questionIds().forEach(function(id){
    (T.NODES[id].a||[]).forEach(function(a,ai){ if(a.to===qid) pointing.push(id+' option '+(ai+1)); });
  });
  var msg='Delete "'+(T.NODES[qid].tag||qid)+'"?';
  if(pointing.length) msg+='\n\n'+pointing.length+' option(s) point here and will be left with no target:\n'+pointing.join('\n');
  if(!confirm(msg)) return;
  questionIds().forEach(function(id){
    (T.NODES[id].a||[]).forEach(function(a){ if(a.to===qid) a.to=''; });
  });
  delete T.NODES[qid];
  markDirty(); sel=null; render();
}

/* ===========================================================================
   INSPECTOR
   ========================================================================= */
var tab='inspect';
['Inspect','Paths','Content','Check'].forEach(function(k){
  document.getElementById('tab'+k).onclick=function(){
    tab=k.toLowerCase();
    ['Inspect','Paths','Content','Check'].forEach(function(o){
      document.getElementById('tab'+o).setAttribute('aria-selected',String(o===k));
    });
    renderPane();
  };
});
var pane=document.getElementById('pane');

function field(label,val,oninput,opt){
  opt=opt||{};
  var wrap=document.createElement('div'); wrap.className='f';
  var l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  var el=document.createElement(opt.area?'textarea':'input');
  if(!opt.area) el.type='text';
  el.value=val==null?'':val;
  if(opt.rows) el.rows=opt.rows;
  if(opt.cls) el.className=opt.cls;
  if(opt.spell===false) el.spellcheck=false;
  el.oninput=function(){ oninput(el.value); markDirty(); };
  wrap.appendChild(el);
  if(opt.hint){ var h=document.createElement('div'); h.className='hint'; h.textContent=opt.hint; wrap.appendChild(h); }
  return wrap;
}
function selectField(label,val,options,onchange,hint){
  var wrap=document.createElement('div'); wrap.className='f';
  var l=document.createElement('label'); l.textContent=label; wrap.appendChild(l);
  var s=document.createElement('select');
  options.forEach(function(o){
    var op=document.createElement('option'); op.value=o.v; op.textContent=o.t;
    if(o.v===val) op.selected=true; s.appendChild(op);
  });
  s.onchange=function(){ onchange(s.value); markDirty(); };
  wrap.appendChild(s);
  if(hint){ var h=document.createElement('div'); h.className='hint'; h.textContent=hint; wrap.appendChild(h); }
  return wrap;
}
function sectionTitle(t){ var d=document.createElement('div'); d.className='sec'; d.textContent=t; return d; }
function button(text,fn,cls){ var b=document.createElement('button'); b.className='btn '+(cls||''); b.textContent=text; b.onclick=fn; return b; }

function targetOptions(){
  var out=[{v:'',t:'— choose a destination —'}];
  questionIds().forEach(function(id){
    out.push({v:id,t:(T.NODES[id].tag||id)+' — '+(T.NODES[id].q||'').slice(0,40)});
  });
  Object.keys(TERMINALS).forEach(function(t){ out.push({v:t,t:'▸ '+TERMINALS[t]}); });
  out.push({v:'__new__',t:'＋ Create a new question here'});
  return out;
}
function pathwayOptions(){
  var out=[{v:'',t:'— none —'}];
  Object.keys(T.OUT).forEach(function(k){ out.push({v:k,t:T.OUT[k].name||k}); });
  return out;
}

function renderPane(){
  pane.innerHTML='';
  if(tab==='paths') return renderPaths();
  if(tab==='content') return renderContent();
  if(tab==='check') return renderChecks();
  if(!sel){ pane.innerHTML='<div class="empty">Click a question or an option on the tree to edit it.<br><br>The <b>+</b> beside a row of options adds another one.</div>'; return; }

  if(sel.kind==='q'){
    var q=T.NODES[sel.id]; if(!q){ sel=null; return renderPane(); }
    var h=document.createElement('div');
    h.innerHTML='<h2>'+esc(q.tag||sel.id)+'</h2><p class="sub">Question · id <code>'+esc(sel.id)+'</code></p>';
    pane.appendChild(h);
    pane.appendChild(field('Label above the question',q.tag,function(v){ q.tag=v; render(); }));
    pane.appendChild(field('Short name (shown on other cards)',q.short,function(v){ q.short=v; render(); },{hint:'Used where an option says where it leads.'}));
    pane.appendChild(field('The question',q.q,function(v){ q.q=v; render(); },{area:true,rows:3}));
    pane.appendChild(field('Note shown under it (optional)',q.note,function(v){ q.note=v; },{area:true,rows:4,hint:'Use for a risk warning or extra context.'}));
    var chk=document.createElement('label'); chk.className='chk f';
    var cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!q.risky;
    cb.onchange=function(){ q.risky=cb.checked; markDirty(); render(); };
    chk.appendChild(cb); chk.appendChild(document.createTextNode('Treat as a risk decision (amber styling)'));
    pane.appendChild(chk);

    pane.appendChild(sectionTitle('Options ('+(q.a||[]).length+')'));
    var list=document.createElement('div'); list.className='olist';
    (q.a||[]).forEach(function(a,ai){
      var it=document.createElement('div'); it.className='oitem';
      var top=document.createElement('div'); top.className='top';
      top.innerHTML='<span class="n">'+(ai+1)+'</span><span class="lbl">'+esc(a.label||'(no label)')+'</span>';
      top.appendChild(button('Edit',function(){ select({kind:'o',id:sel.id,ai:ai}); },'sm'));
      it.appendChild(top);
      list.appendChild(it);
    });
    pane.appendChild(list);
    var row=document.createElement('div'); row.className='row'; row.style.marginTop='10px';
    row.appendChild(button('+ Add option',function(){ addOption(sel.id); },'solid'));
    row.appendChild(button('Delete question',function(){ removeQuestion(sel.id); },'danger'));
    pane.appendChild(row);
    return;
  }

  /* option */
  var q2=T.NODES[sel.id]; if(!q2||!q2.a||!q2.a[sel.ai]){ sel=null; return renderPane(); }
  var a=q2.a[sel.ai];
  var hd=document.createElement('div');
  hd.innerHTML='<h2>Option '+(sel.ai+1)+'</h2><p class="sub">of '+esc(q2.tag||sel.id)+'</p>';
  pane.appendChild(hd);
  pane.appendChild(field('Label on the card',a.label,function(v){ a.label=v; render(); }));
  pane.appendChild(field('Short form',a.short,function(v){ a.short=v; },{hint:'Used in the printed summary of answers.'}));
  pane.appendChild(field('Hint under the label (optional)',a.hint,function(v){ a.hint=v; },
    {hint:'A short line shown on the card before anyone answers — examples, say.'}));
  pane.appendChild(field('Note once chosen (optional)',a.note,function(v){ a.note=v; },{area:true,rows:3,

/* ---- previewing HTML ------------------------------------------------------
   Guide sections and walkthrough screens are HTML, and the reader renders them
   with innerHTML. The server cleans published content whatever this page does;
   this is the editor's own pass, so that a preview never runs what it shows.
   It parses into an inert <template> — nothing inside one loads or runs — and
   takes out anything that could act before a node is moved into the page. */
var PREVIEW_DROP={SCRIPT:1,STYLE:1,IFRAME:1,FRAME:1,FRAMESET:1,OBJECT:1,EMBED:1,
                  LINK:1,META:1,BASE:1,TEMPLATE:1,NOSCRIPT:1,SET:1,ANIMATE:1};
var PREVIEW_URL_ATTR={href:1,src:1,srcset:1,action:1,formaction:1,'xlink:href':1,
                      poster:1,background:1,data:1};
function cleanFragment(html){
  var tpl=document.createElement('template');
  tpl.innerHTML=String(html==null?'':html);
  (function walk(node){
    Array.prototype.slice.call(node.childNodes).forEach(function(k){
      if(k.nodeType!==1) return;
      if(PREVIEW_DROP[String(k.nodeName).toUpperCase()]){ node.removeChild(k); return; }
      Array.prototype.slice.call(k.attributes).forEach(function(a){
        var n=a.name.toLowerCase();
        /* a browser ignores whitespace and control characters inside a URL
           scheme, so "java&#9;script:" is javascript: — compare without them */
        var v=String(a.value).replace(/[\u0000- ]+/g,'').toLowerCase();
        if(n.indexOf('on')===0||n==='srcdoc'
           ||(PREVIEW_URL_ATTR[n]&&/^(javascript|vbscript|data):/.test(v))) k.removeAttribute(a.name);
      });
      walk(k);
    });
  })(tpl.content);
  return tpl.content;
}
function previewBox(html){
  var wrap=document.createElement('div');
  var k=document.createElement('div'); k.className='prevk'; k.textContent='Preview';
  var box=document.createElement('div'); box.className='prev';
  /* a link in the preview is there to be seen, not followed out of the editor */
  box.addEventListener('click',function(ev){
    if(ev.target.closest&&ev.target.closest('a')) ev.preventDefault();
  });
  wrap.appendChild(k); wrap.appendChild(box);
  function paint(h){ box.innerHTML=''; box.appendChild(document.importNode(cleanFragment(h),true)); }
  var t=null;
  paint(html);
  wrap.update=function(h){ clearTimeout(t); t=setTimeout(function(){ paint(h); },160); };
  return wrap;
}

/* ---- lists of titled HTML: the guide's sections, the walkthrough's screens
   One open at a time, because each carries a long textarea and a preview, and
   ten of them open at once is a page nobody can find their place in. */
var GUIDE_MAX=40, WALK_MAX=12;   /* what a published tree may carry — the server's limits */
/* The walkthrough's drawings live in index.html as WALK_ART, one per screen
   position; there are four. They are drawn in the tree's own idiom rather than
   written as content, so they are not editable here — only described. */
var WALK_ART_COUNT=4;
var OPENI={guide:-1,walk:-1};
function moveItem(arr,kind,i,d){
  var j=i+d;
  if(j<0||j>=arr.length) return;
  var x=arr[i]; arr[i]=arr[j]; arr[j]=x;
  if(OPENI[kind]===i) OPENI[kind]=j; else if(OPENI[kind]===j) OPENI[kind]=i;
  markDirty(); refreshPane();
}
function deleteItem(arr,kind,i,o){
  if(arr.length<=o.min){ alert(o.minMsg); return; }
  if(!confirm('Delete '+o.noun+' '+(i+1)+', “'+(arr[i].h||'untitled')+'”?\n\nThere is no undo.')) return;
  arr.splice(i,1);
  if(OPENI[kind]===i) OPENI[kind]=-1; else if(OPENI[kind]>i) OPENI[kind]--;
  markDirty(); refreshPane();
}
function sectionsEditor(arr,kind,o){
  var list=document.createElement('div'); list.className='olist';
  arr.forEach(function(s,i){
    var open=OPENI[kind]===i;
    var it=document.createElement('div'); it.className='oitem';
    var top=document.createElement('div'); top.className='top';
    top.innerHTML='<span class="n">'+(i+1)+'</span><span class="lbl"></span>';
    var lbl=top.querySelector('.lbl'); lbl.textContent=s.h||'(untitled)';
    var up=button('↑',function(){ moveItem(arr,kind,i,-1); },'sm');
    up.title='Move up'; up.setAttribute('aria-label','Move '+o.noun+' '+(i+1)+' up'); up.disabled=i===0;
    var dn=button('↓',function(){ moveItem(arr,kind,i,1); },'sm');
    dn.title='Move down'; dn.setAttribute('aria-label','Move '+o.noun+' '+(i+1)+' down'); dn.disabled=i===arr.length-1;
    var ed=button(open?'Close':'Edit',function(){ OPENI[kind]=open?-1:i; refreshPane(); },'sm');
    var del=button('Delete',function(){ deleteItem(arr,kind,i,o); },'sm danger');
    [up,dn,ed,del].forEach(function(b){ top.appendChild(b); });
    it.appendChild(top);
    if(o.meta){
      var m=document.createElement('div'); m.className='meta'; m.textContent=o.meta(i,arr.length);
      it.appendChild(m);
    }
    if(open){
      var body=document.createElement('div'); body.className='body';
      body.appendChild(field('Title',s.h,function(v){ s.h=v; lbl.textContent=v||'(untitled)'; }));
      var pv=previewBox(s.html);
      body.appendChild(field('Text (HTML)',s.html,function(v){ s.html=v; pv.update(v); },
        {area:true,rows:10,cls:'html',spell:false,hint:o.htmlHint}));
      body.appendChild(pv);
      it.appendChild(body);
    }
    list.appendChild(it);
  });
  pane.appendChild(list);
  var row=document.createElement('div'); row.className='row'; row.style.marginTop='10px';
  var add=button('+ Add a '+o.noun,function(){
    if(arr.length>=o.max) return;
    arr.push({h:'New '+o.noun,html:'<p></p>'});
    OPENI[kind]=arr.length-1;
    markDirty(); renderPane(); pane.scrollTop=pane.scrollHeight;
  },'solid');
  add.disabled=arr.length>=o.max;
  row.appendChild(add);
  pane.appendChild(row);
  if(arr.length>=o.max) note('That is as many as a published tree may carry ('+o.max+').');
}
